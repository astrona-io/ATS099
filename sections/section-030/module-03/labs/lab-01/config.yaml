# Promote Staging To Production Lab
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-099-lab-030-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, starts Gitea, seeds the repositories and bootstraps Flux from gitops/fleet"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-099-lab-030-03-setup"
      description: "Creates both remote sides and kubeconfig Secrets, and commits the Kustomization podinfo-staging without a health check"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Gitea, the tester pod and the webhook receiver"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits for Gitea and the Flux controllers that exist"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-staging-gated"
      description: "Passes when podinfo-staging has wait or healthChecks in Git and in the cluster, and is Ready"
      type: "file"
      source: "validation/validate-staging-gated.sh"
    - name: "validate-production-in-git"
      description: "Passes when podinfo-production is in Git with kubeConfig, path and dependsOn on podinfo-staging"
      type: "file"
      source: "validation/validate-production-in-git.sh"
    - name: "validate-production-running"
      description: "Passes when podinfo-production is Ready, runs in podinfo-production, and both accounts stay scoped"
      type: "file"
      source: "validation/validate-production-running.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - mendhak/http-https-echo:42
      - nicolaka/netshoot:v0.13
