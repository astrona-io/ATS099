# The "remote cluster" side of section 030. In real life these objects live on
# the other cluster; here they live in this one, and Flux reaches them through
# https://kubernetes.default.svc with the token of flux-deployer.
apiVersion: v1
kind: Namespace
metadata:
  name: staging-access
---
apiVersion: v1
kind: Namespace
metadata:
  name: podinfo-staging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-deployer
  namespace: staging-access
---
# A long-lived token for flux-deployer. Kubernetes fills in token and ca.crt.
apiVersion: v1
kind: Secret
metadata:
  name: flux-deployer-token
  namespace: staging-access
  annotations:
    kubernetes.io/service-account.name: flux-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: podinfo-staging
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-deployer
  namespace: podinfo-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - kind: ServiceAccount
    name: flux-deployer
    namespace: staging-access
