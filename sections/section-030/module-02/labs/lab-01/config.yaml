# Rotate The Token In A kubeconfig Secret Lab
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-099-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, starts Gitea, seeds the repositories and bootstraps Flux from gitops/fleet"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-099-lab-030-02-setup"
      description: "Creates the remote side, builds staging-kubeconfig from the old token, commits the Kustomization podinfo-staging, and stores the hash of the old token"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Gitea, the tester pod and the webhook receiver"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits for Gitea and the Flux controllers that exist"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-kubeconfig-rotated"
      description: "Passes when staging-kubeconfig holds a token that is not the old one and that signs in as flux-deployer"
      type: "file"
      source: "validation/validate-kubeconfig-rotated.sh"
    - name: "validate-old-token-removed"
      description: "Passes when the Secret flux-deployer-token is gone and one token Secret remains for flux-deployer"
      type: "file"
      source: "validation/validate-old-token-removed.sh"
    - name: "validate-delivery-works"
      description: "Passes when podinfo-staging reconciles with the new Secret, podinfo runs, and flux-deployer is still scoped"
      type: "file"
      source: "validation/validate-delivery-works.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - mendhak/http-https-echo:42
      - nicolaka/netshoot:v0.13
