  - id: c
    text: A Role cannot hold `create`.
    explanation: Not correct. Create the namespace when the cluster is set up, or
      give a separate account a narrow ClusterRole.
  - id: d
    text: Namespaces can only be created by the API server.
    explanation: Not correct. Create the namespace when the cluster is set up, or
      give a separate account a narrow ClusterRole.
  correct_option: b
  explanation: Correct. Create the namespace when the cluster is set up, or give a
    separate account a narrow ClusterRole.
- id: ats099-030-q33
  type: single_choice
  difficulty: beginner
