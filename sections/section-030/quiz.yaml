  explanation: Correct. Health checks watch the remote objects with the same client
    as the apply.
- id: ats099-030-q35
  type: single_choice
  difficulty: intermediate
  learning_objective: Protect an object from pruning
  source_readings:
  - sections/section-030/module-02/course-04-remote-health-checks-and-pruning.md
  prompt: How do you stop Flux from pruning a PersistentVolumeClaim that stays in
