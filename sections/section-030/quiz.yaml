  difficulty: intermediate
  learning_objective: Say what a missing list and watch breaks
  source_readings:
  - sections/section-030/module-02/course-04-remote-health-checks-and-pruning.md
  prompt: A Role has `create` and `patch` but not `list` and `watch`. What happens?
