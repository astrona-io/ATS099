scope:
  type: section
  id: section-030
  title: Cross-Namespace References And Remote Clusters
placement:
  position: after
  reading: sections/section-030/capstone/labs/lab-01/question.md
questions:
- id: ats099-030-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Describe sourceRef.namespace
  source_readings:
  - sections/section-030/module-01/course-01-cross-namespace-references.md
  prompt: What does sourceRef.namespace do on a Flux Kustomization?
  options:
  - id: a
    text: It creates the source in that namespace.
    explanation: Not correct. It only points at an existing source.
  - id: b
    text: It sets the namespace the objects are applied to.
    explanation: Not correct. targetNamespace does that.
  - id: c
    text: It makes Flux look for the source in that namespace instead of the Kustomization's
      own.
    explanation: Correct. Without it, Flux uses the object's own namespace.
  - id: d
    text: It copies the source to every namespace.
    explanation: Not correct. Nothing is copied.
  correct_option: c
  explanation: Correct. Without it, Flux uses the object's own namespace.
- id: ats099-030-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the cross-namespace risk
  source_readings:
  - sections/section-030/module-01/course-01-cross-namespace-references.md
  prompt: Why does a shared platform forbid cross-namespace references?
  options:
  - id: a
    text: They make source-controller crash.
    explanation: Not correct. The risk is access, not stability.
  - id: b
    text: They are not supported by Flux.
    explanation: Not correct. They work by default.
  - id: c
    text: They double the storage of every artifact.
    explanation: Not correct. They save a fetch.
  - id: d
    text: A team could point at the platform's GitRepository and apply folders that
      are not theirs.
    explanation: Correct. That source holds the whole platform repository.
  correct_option: d
  explanation: Correct. That source holds the whole platform repository.
- id: ats099-030-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Name the lockdown flag
  source_readings:
  - sections/section-030/module-01/course-01-cross-namespace-references.md
  prompt: Which flag refuses references to other namespaces?
  options:
  - id: a
    text: "--no-cross-namespace-refs=true"
    explanation: Correct. It is part of the multi-tenancy lockdown.
  - id: b
    text: "--no-remote-bases=true"
    explanation: Not correct. It stops remote Kustomize bases.
  - id: c
    text: "--default-service-account=default"
    explanation: Not correct. It sets the account used when none is named.
  - id: d
    text: "--log-level=debug"
    explanation: Not correct. It only raises the log detail.
  correct_option: a
  explanation: Correct. It is part of the multi-tenancy lockdown.
- id: ats099-030-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: List what the flag covers
  source_readings:
  - sections/section-030/module-01/course-01-cross-namespace-references.md
  prompt: Besides sourceRef, what else does --no-cross-namespace-refs=true refuse?
  options:
  - id: a
    text: Only sourceRef.
    explanation: Not correct. It covers more reference fields.
  - id: b
    text: dependsOn and Alert event sources in other namespaces.
    explanation: Correct. The flag covers all references that cross namespaces.
  - id: c
    text: Every secretRef in any namespace.
    explanation: Not correct. A secretRef already looks only in the object's own namespace.
  - id: d
    text: Network traffic between pods.
    explanation: Not correct. Flux flags do not filter pod traffic.
  correct_option: b
  explanation: Correct. The flag covers all references that cross namespaces.
- id: ats099-030-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Name the remote cluster field
  source_readings:
  - sections/section-030/module-01/course-02-applying-to-a-remote-cluster.md
  prompt: Which field makes a Flux Kustomization apply to another cluster?
  options:
  - id: a
    text: spec.serviceAccountName
    explanation: Not correct. It selects the account to impersonate in the same cluster.
  - id: b
    text: spec.targetNamespace
    explanation: Not correct. It sets a namespace.
  - id: c
    text: spec.sourceRef
    explanation: Not correct. It selects the source.
  - id: d
    text: spec.kubeConfig.secretRef
    explanation: Correct. It names the Secret that holds the kubeconfig.
  correct_option: d
  explanation: Correct. It names the Secret that holds the kubeconfig.
- id: ats099-030-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Split the work between clusters
  source_readings:
  - sections/section-030/module-01/course-02-applying-to-a-remote-cluster.md
  prompt: With spec.kubeConfig set, which part goes through the kubeconfig?
  options:
  - id: a
    text: Only the apply. Fetching and building stay on the cluster that runs Flux.
    explanation: Correct. source-controller and kustomize-controller still run locally.
  - id: b
    text: Fetching, building and applying.
    explanation: Not correct. Only the apply goes to the remote cluster.
  - id: c
    text: Only the fetch of the Git source.
    explanation: Not correct. The fetch is local.
  - id: d
    text: Only the build with Kustomize.
    explanation: Not correct. The build is local.
  correct_option: a
  explanation: Correct. source-controller and kustomize-controller still run locally.
- id: ats099-030-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Know the default Secret key
  source_readings:
  - sections/section-030/module-01/course-02-applying-to-a-remote-cluster.md
  prompt: Which key of the kubeconfig Secret does Flux read by default?
  options:
  - id: a
    text: kubeconfig
    explanation: Not correct. Flux does not look for that key by default.
  - id: b
    text: value (or value.yaml).
    explanation: Correct. Another key needs secretRef.key.
  - id: c
    text: config
    explanation: Not correct. That is the file name kubectl uses, not the Secret key.
  - id: d
    text: token
    explanation: Not correct. token holds a ServiceAccount token, not a kubeconfig.
  correct_option: b
  explanation: Correct. Another key needs secretRef.key.
- id: ats099-030-q08
  type: single_choice
  difficulty: advanced
  learning_objective: Predict a failed apply
  source_readings:
  - sections/section-030/module-01/course-02-applying-to-a-remote-cluster.md
  prompt: The remote account may only change the namespace podinfo-staging. The delivered
    folder contains a Namespace object. What happens?
  options:
  - id: a
    text: Flux creates the Namespace with its own rights.
    explanation: Not correct. The apply uses the account in the kubeconfig.
  - id: b
    text: Flux skips the Namespace object.
    explanation: Not correct. It tries to apply it and fails.
  - id: c
    text: The apply fails, because the account cannot create namespaces.
    explanation: Correct. Create the namespace when the cluster is set up.
  - id: d
    text: The account is promoted to cluster-admin.
    explanation: Not correct. Rights never change by themselves.
  correct_option: c
  explanation: Correct. Create the namespace when the cluster is set up.
- id: ats099-030-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Name the Cluster API Secret
  source_readings:
  - sections/section-030/module-01/course-03-cluster-api-and-fleets.md
  prompt: Cluster API creates a cluster named staging in the namespace clusters. Which
    Secret does it write for Flux?
  options:
  - id: a
    text: staging-token in flux-system.
    explanation: Not correct. Cluster API writes into the Cluster's namespace.
  - id: b
    text: staging-kubeconfig in the namespace clusters, with the kubeconfig under
      the key value.
    explanation: Correct. Put the Flux Kustomization in the same namespace.
  - id: c
    text: kubeconfig-staging in kube-system.
    explanation: Not correct. The name is <cluster>-kubeconfig.
  - id: d
    text: No Secret. Flux reads the Cluster object directly.
    explanation: Not correct. Flux needs the Secret.
  correct_option: b
  explanation: Correct. Put the Flux Kustomization in the same namespace.
- id: ats099-030-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Compare the two layouts
  source_readings:
  - sections/section-030/module-01/course-03-cluster-api-and-fleets.md
  prompt: In the hub and spoke layout, what does the management cluster hold that
    a standalone setup does not?
  options:
  - id: a
    text: A copy of every cluster's data.
    explanation: Not correct. Flux does not hold data.
  - id: b
    text: The controllers of every workload cluster.
    explanation: Not correct. Workload clusters run no Flux, and the controllers stay
      on the hub.
  - id: c
    text: A credential for every workload cluster.
    explanation: Correct. Protect the management cluster like the most sensitive one.
  - id: d
    text: Nothing extra, because kubeconfigs live in Git.
    explanation: Not correct. A kubeconfig is a Secret, never in Git.
  correct_option: c
  explanation: Correct. Protect the management cluster like the most sensitive one.
- id: ats099-030-q11
  type: single_choice
  difficulty: beginner
  learning_objective: Read a failing remote apply in order
  source_readings:
  - sections/section-030/module-01/course-04-reading-a-failing-remote-apply.md
  prompt: A remote Kustomization fails with a message about an unknown certificate
    authority. Which stage failed?
  options:
  - id: a
    text: 'The rights: the account lacks a verb.'
    explanation: 'Not correct. The stages run in order: Secret, kubeconfig, connection,
      certificate, login, rights. The message names the stage.'
  - id: b
    text: 'The Secret: the key `value` is missing.'
    explanation: 'Not correct. The stages run in order: Secret, kubeconfig, connection,
      certificate, login, rights. The message names the stage.'
  - id: c
    text: 'The certificate: `certificate-authority-data` is missing or belongs to
      another cluster.'
    explanation: 'Correct. The stages run in order: Secret, kubeconfig, connection,
      certificate, login, rights. The message names the stage.'
  - id: d
    text: 'The login: the token has expired.'
    explanation: 'Not correct. The stages run in order: Secret, kubeconfig, connection,
      certificate, login, rights. The message names the stage.'
  correct_option: c
  explanation: 'Correct. The stages run in order: Secret, kubeconfig, connection,
    certificate, login, rights. The message names the stage.'
- id: ats099-030-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: Test the address from the right place
  source_readings:
  - sections/section-030/module-01/course-04-reading-a-failing-remote-apply.md
  prompt: A kubeconfig uses `https://kubernetes.default.svc`. Why does a check from
    your laptop fail although the Kustomization works?
  options:
  - id: a
    text: The token is valid only for the controller.
    explanation: Not correct. The address must work from the pod of kustomize-controller,
      not from your machine.
  - id: b
    text: That address only resolves inside the cluster, so the check must run from
      a pod in it.
    explanation: Correct. The address must work from the pod of kustomize-controller,
      not from your machine.
  - id: c
    text: kubectl cannot read a kubeconfig from a Secret.
    explanation: Not correct. The address must work from the pod of kustomize-controller,
      not from your machine.
  - id: d
    text: The certificate is valid only for `localhost`.
    explanation: Not correct. The address must work from the pod of kustomize-controller,
      not from your machine.
  correct_option: b
  explanation: Correct. The address must work from the pod of kustomize-controller,
    not from your machine.
- id: ats099-030-q13
  type: single_choice
  difficulty: intermediate
  learning_objective: Say what a failing remote apply leaves behind
  source_readings:
  - sections/section-030/module-01/course-04-reading-a-failing-remote-apply.md
  prompt: A remote Kustomization starts to fail. What happens to the objects it applied
    before?
  options:
  - id: a
    text: They keep running; a failing Kustomization does not remove what it applied.
    explanation: Correct. A failure stops new applies. It does not delete anything.
  - id: b
    text: They are pruned at the next interval.
    explanation: Not correct. A failure stops new applies. It does not delete anything.
  - id: c
    text: They are suspended by the controller.
    explanation: Not correct. A failure stops new applies. It does not delete anything.
  - id: d
    text: They are moved to the management cluster.
    explanation: Not correct. A failure stops new applies. It does not delete anything.
  correct_option: a
  explanation: Correct. A failure stops new applies. It does not delete anything.
- id: ats099-030-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: Name the fix for forbidden
  source_readings:
  - sections/section-030/module-01/course-04-reading-a-failing-remote-apply.md
  prompt: The status says the account `flux-deployer` cannot `create` `configmaps`
    in `podinfo-staging`. What is the right fix?
  options:
  - id: a
    text: Bind the account to `cluster-admin`.
    explanation: Not correct. Grant exactly the verb and kind that the message names,
      in the namespace it names.
  - id: b
    text: Delete the Kustomization and recreate it.
    explanation: Not correct. Grant exactly the verb and kind that the message names,
      in the namespace it names.
  - id: c
    text: Turn on `--insecure-kubeconfig-tls`.
    explanation: Not correct. Grant exactly the verb and kind that the message names,
      in the namespace it names.
  - id: d
    text: Grant `create` on `configmaps` in `podinfo-staging` only, if the folder
      should hold ConfigMaps.
    explanation: Correct. Grant exactly the verb and kind that the message names,
      in the namespace it names.
  correct_option: d
  explanation: Correct. Grant exactly the verb and kind that the message names, in
    the namespace it names.
- id: ats099-030-q15
  type: single_choice
  difficulty: beginner
  learning_objective: Know which references never cross a namespace
  source_readings:
  - sections/section-030/module-01/course-05-cross-namespace-rules-for-other-kinds.md
  prompt: Which reference can never point at another namespace?
  options:
  - id: a
    text: "`spec.sourceRef.namespace` on a Kustomization"
    explanation: Not correct. Secret and ConfigMap references are always in the namespace
      of the object that uses them.
  - id: b
    text: "`spec.dependsOn[].namespace`"
    explanation: Not correct. Secret and ConfigMap references are always in the namespace
      of the object that uses them.
  - id: c
    text: "`spec.kubeConfig.secretRef`"
    explanation: Correct. Secret and ConfigMap references are always in the namespace
      of the object that uses them.
  - id: d
    text: "`spec.eventSources[].namespace` on an Alert"
    explanation: Not correct. Secret and ConfigMap references are always in the namespace
      of the object that uses them.
  correct_option: c
  explanation: Correct. Secret and ConfigMap references are always in the namespace
    of the object that uses them.
- id: ats099-030-q16
  type: single_choice
  difficulty: intermediate
  learning_objective: Know where a Provider must be
  source_readings:
  - sections/section-030/module-01/course-05-cross-namespace-rules-for-other-kinds.md
  prompt: An Alert is in `team-a`. Where must its Provider be?
  options:
  - id: a
    text: In `flux-system`.
    explanation: Not correct. An Alert finds its Provider in its own namespace only.
  - id: b
    text: In `team-a`; `providerRef` takes no namespace.
    explanation: Correct. An Alert finds its Provider in its own namespace only.
  - id: c
    text: In any namespace named in `providerRef.namespace`.
    explanation: Not correct. An Alert finds its Provider in its own namespace only.
  - id: d
    text: In the namespace of the event source.
    explanation: Not correct. An Alert finds its Provider in its own namespace only.
  correct_option: b
  explanation: Correct. An Alert finds its Provider in its own namespace only.
- id: ats099-030-q17
  type: single_choice
  difficulty: intermediate
  learning_objective: Say what the lockdown flag restricts
  source_readings:
  - sections/section-030/module-01/course-05-cross-namespace-rules-for-other-kinds.md
  prompt: What does `--no-cross-namespace-refs=true` restrict?
  options:
  - id: a
    text: References from one Flux object to another in a different namespace.
    explanation: Correct. Restricting what is applied is the job of impersonation
      with a limited ServiceAccount.
  - id: b
    text: Which namespaces a Kustomization may apply objects into.
    explanation: Not correct. Restricting what is applied is the job of impersonation
      with a limited ServiceAccount.
  - id: c
    text: Which users may create Flux objects.
    explanation: Not correct. Restricting what is applied is the job of impersonation
      with a limited ServiceAccount.
  - id: d
    text: Which Secrets the controllers may read.
    explanation: Not correct. Restricting what is applied is the job of impersonation
      with a limited ServiceAccount.
  correct_option: a
  explanation: Correct. Restricting what is applied is the job of impersonation with
    a limited ServiceAccount.
- id: ats099-030-q18
  type: single_choice
  difficulty: advanced
  learning_objective: List cross-namespace references before the flag
  source_readings:
  - sections/section-030/module-01/course-05-cross-namespace-rules-for-other-kinds.md
  prompt: What should you do before you set `--no-cross-namespace-refs=true` on a
    cluster that already runs Flux?
  options:
  - id: a
    text: Restart all the controllers.
    explanation: Not correct. Objects that use a cross-namespace reference stop reconciling
      when the flag is on.
  - id: b
    text: Delete every Alert and Receiver.
    explanation: Not correct. Objects that use a cross-namespace reference stop reconciling
      when the flag is on.
  - id: c
    text: Nothing; existing objects are not checked.
    explanation: Not correct. Objects that use a cross-namespace reference stop reconciling
      when the flag is on.
  - id: d
    text: List the existing cross-namespace references and move or accept each one.
    explanation: Correct. Objects that use a cross-namespace reference stop reconciling
      when the flag is on.
  correct_option: d
  explanation: Correct. Objects that use a cross-namespace reference stop reconciling
    when the flag is on.
- id: ats099-030-q19
  type: single_choice
  difficulty: beginner
  learning_objective: Say where Flux looks for the kubeconfig Secret
  source_readings:
  - sections/section-030/module-02/course-01-how-flux-reads-a-kubeconfig-secret.md
  prompt: In which namespace does Flux look for the Secret named in `spec.kubeConfig.secretRef.name`?
  options:
  - id: a
    text: In `flux-system` only.
    explanation: Not correct. There is no field for another namespace, so one tenant
      cannot name another tenant's credential.
  - id: b
    text: In `kube-system`.
    explanation: Not correct. There is no field for another namespace, so one tenant
      cannot name another tenant's credential.
  - id: c
    text: In the namespace of the Kustomization.
    explanation: Correct. There is no field for another namespace, so one tenant cannot
      name another tenant's credential.
  - id: d
    text: In any namespace that has the Secret.
    explanation: Not correct. There is no field for another namespace, so one tenant
      cannot name another tenant's credential.
  correct_option: c
  explanation: Correct. There is no field for another namespace, so one tenant cannot
    name another tenant's credential.
- id: ats099-030-q20
  type: single_choice
  difficulty: beginner
  learning_objective: Know which key is read
  source_readings:
  - sections/section-030/module-02/course-01-how-flux-reads-a-kubeconfig-secret.md
  prompt: Which key of the Secret does Flux read by default?
  options:
  - id: a
    text: "`kubeconfig`"
    explanation: Not correct. The field `secretRef.key` selects another key.
  - id: b
    text: "`value`, then `value.yaml` if there is no `value`."
    explanation: Correct. The field `secretRef.key` selects another key.
  - id: c
    text: "`config`"
    explanation: Not correct. The field `secretRef.key` selects another key.
  - id: d
    text: "`token`"
    explanation: Not correct. The field `secretRef.key` selects another key.
  correct_option: b
  explanation: Correct. The field `secretRef.key` selects another key.
- id: ats099-030-q21
  type: single_choice
  difficulty: intermediate
  learning_objective: Fix a wrong key without renaming it
  source_readings:
  - sections/section-030/module-02/course-01-how-flux-reads-a-kubeconfig-secret.md
  prompt: A Secret was made with `--from-file=staging.kubeconfig`. How do you make
    the Kustomization read it?
  options:
  - id: a
    text: Set `spec.kubeConfig.secretRef.key` to `staging.kubeconfig`.
    explanation: Correct. The key is chosen with `secretRef.key`; a Secret key can
      also be recreated as `value`.
  - id: b
    text: Set `spec.kubeConfig.file` to the file name.
    explanation: Not correct. The key is chosen with `secretRef.key`; a Secret key
      can also be recreated as `value`.
  - id: c
    text: Add the annotation `kustomize.toolkit.fluxcd.io/key`.
    explanation: Not correct. The key is chosen with `secretRef.key`; a Secret key
      can also be recreated as `value`.
  - id: d
    text: Rename the Secret to `value`.
    explanation: Not correct. The key is chosen with `secretRef.key`; a Secret key
      can also be recreated as `value`.
  correct_option: a
  explanation: Correct. The key is chosen with `secretRef.key`; a Secret key can also
    be recreated as `value`.
- id: ats099-030-q22
  type: single_choice
  difficulty: intermediate
  learning_objective: Know what the exec flag allows
  source_readings:
  - sections/section-030/module-02/course-01-how-flux-reads-a-kubeconfig-secret.md
  prompt: What does `--insecure-kubeconfig-exec` allow?
  options:
  - id: a
    text: Kubeconfigs that skip TLS verification.
    explanation: Not correct. A Secret that can run a program in the controller pod
      is refused by default.
  - id: b
    text: Kubeconfigs in a namespace other than the Kustomization's.
    explanation: Not correct. A Secret that can run a program in the controller pod
      is refused by default.
  - id: c
    text: Kubeconfigs with more than one context.
    explanation: Not correct. A Secret that can run a program in the controller pod
      is refused by default.
  - id: d
    text: Kubeconfigs that run a program (`exec`) or use an `auth-provider`.
    explanation: Correct. A Secret that can run a program in the controller pod is
      refused by default.
  correct_option: d
  explanation: Correct. A Secret that can run a program in the controller pod is refused
    by default.
- id: ats099-030-q23
  type: single_choice
  difficulty: intermediate
  learning_objective: Know what the TLS flag allows
  source_readings:
  - sections/section-030/module-02/course-01-how-flux-reads-a-kubeconfig-secret.md
  prompt: Which kubeconfigs are accepted only when `--insecure-kubeconfig-tls` is
    set?
  options:
  - id: a
    text: Kubeconfigs with a token.
    explanation: Not correct. The flag is set on kustomize-controller and helm-controller
      and applies to every object.
  - id: b
    text: Kubeconfigs with a client certificate in the file.
    explanation: Not correct. The flag is set on kustomize-controller and helm-controller
      and applies to every object.
  - id: c
    text: Kubeconfigs that skip TLS verification or point at a certificate by file
      path.
    explanation: Correct. The flag is set on kustomize-controller and helm-controller
      and applies to every object.
  - id: d
    text: Kubeconfigs for more than one cluster.
    explanation: Not correct. The flag is set on kustomize-controller and helm-controller
      and applies to every object.
  correct_option: c
  explanation: Correct. The flag is set on kustomize-controller and helm-controller
    and applies to every object.
- id: ats099-030-q24
  type: single_choice
  difficulty: intermediate
  learning_objective: Say when a changed Secret takes effect
  source_readings:
  - sections/section-030/module-02/course-01-how-flux-reads-a-kubeconfig-secret.md
  prompt: When does a changed kubeconfig Secret take effect?
  options:
  - id: a
    text: Only after kustomize-controller is restarted.
    explanation: Not correct. The Secret is read on each reconcile, which makes rotation
      without downtime possible.
  - id: b
    text: At the next reconcile, with no restart of the controller.
    explanation: Correct. The Secret is read on each reconcile, which makes rotation
      without downtime possible.
  - id: c
    text: Only after the Kustomization is deleted and recreated.
    explanation: Not correct. The Secret is read on each reconcile, which makes rotation
      without downtime possible.
  - id: d
    text: Only after `flux install` is run again.
    explanation: Not correct. The Secret is read on each reconcile, which makes rotation
      without downtime possible.
  correct_option: b
  explanation: Correct. The Secret is read on each reconcile, which makes rotation
    without downtime possible.
- id: ats099-030-q25
  type: single_choice
  difficulty: beginner
  learning_objective: Say what a long-lived token is
  source_readings:
  - sections/section-030/module-02/course-02-token-lifetime-and-rotation.md
  prompt: What is a token from a Secret of type `kubernetes.io/service-account-token`?
  options:
  - id: a
    text: A ServiceAccount token with no expiry, valid until the Secret or ServiceAccount
      is deleted.
    explanation: 'Correct. The simplicity is the risk: a copy of it works for years.'
  - id: b
    text: A token that expires after 1 hour.
    explanation: 'Not correct. The simplicity is the risk: a copy of it works for
      years.'
  - id: c
    text: A token valid only for one namespace.
    explanation: 'Not correct. The simplicity is the risk: a copy of it works for
      years.'
  - id: d
    text: A token that renews itself.
    explanation: 'Not correct. The simplicity is the risk: a copy of it works for
