  - id: d
    text: A shared GitRepository in `flux-system`.
    explanation: Not correct. A local Flux only needs Git and keeps working when the
      management plane is lost.
  correct_option: b
  explanation: Correct. A local Flux only needs Git and keeps working when the management
    plane is lost.
- id: ats099-030-q41
  type: single_choice
  difficulty: intermediate
  learning_objective: Prefer folders to branches
  source_readings:
  - sections/section-030/module-03/course-02-environments-as-folders-and-overlays.md
  prompt: Why prefer a folder per environment to a branch per environment?
  options:
  - id: a
    text: All environments stay visible on one branch, and merges do not carry unwanted
