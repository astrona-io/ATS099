  difficulty: intermediate
  learning_objective: State the cost of a management cluster
  source_readings:
  - sections/section-030/module-03/course-01-push-and-pull-delivery.md
  prompt: What is the main risk of one management cluster that delivers to many clusters?
  options:
  - id: a
    text: It cannot run health checks.
    explanation: Not correct. Narrow accounts reduce the blast radius.
  - id: b
    text: It needs a Flux instance in every cluster.
    explanation: Not correct. Narrow accounts reduce the blast radius.
  - id: c
    text: It holds credentials for all clusters, so its compromise reaches all of
