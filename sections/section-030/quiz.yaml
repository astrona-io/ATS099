    text: Folders are faster to fetch.
    explanation: Not correct. A diff between environments becomes a diff between folders.
  - id: d
    text: Branches cannot be protected.
    explanation: Not correct. A diff between environments becomes a diff between folders.
  correct_option: a
  explanation: Correct. A diff between environments becomes a diff between folders.
