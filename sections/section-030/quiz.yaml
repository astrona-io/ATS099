  - id: b
    text: TokenReview
    explanation: Correct. A TokenReview returns `authenticated` for the token; an
      invalid token comes back as not authenticated.
  - id: c
    text: CertificateSigningRequest
    explanation: Not correct. A TokenReview returns `authenticated` for the token;
      an invalid token comes back as not authenticated.
  - id: d
    text: SubjectAccessReview on the token
    explanation: Not correct. A TokenReview returns `authenticated` for the token;
      an invalid token comes back as not authenticated.
  correct_option: b
  explanation: Correct. A TokenReview returns `authenticated` for the token; an invalid
    token comes back as not authenticated.
- id: ats099-030-q29
  type: single_choice
  difficulty: advanced
  learning_objective: Know what deleting the token Secret does
  source_readings:
  - sections/section-030/module-02/course-02-token-lifetime-and-rotation.md
  prompt: What happens to a long-lived token when its Secret is deleted?
  options:
  - id: a
    text: It stops working, because the API server checks that the Secret still exists.
    explanation: Correct. Deleting the token Secret is how the old credential is revoked.
  - id: b
    text: It keeps working until it is older than 1 year.
    explanation: Not correct. Deleting the token Secret is how the old credential
      is revoked.
  - id: c
    text: It keeps working until the ServiceAccount is deleted.
    explanation: Not correct. Deleting the token Secret is how the old credential
      is revoked.
  - id: d
    text: It is moved to the ServiceAccount.
    explanation: Not correct. Deleting the token Secret is how the old credential
      is revoked.
  correct_option: a
  explanation: Correct. Deleting the token Secret is how the old credential is revoked.
- id: ats099-030-q30
  type: single_choice
  difficulty: beginner
  learning_objective: Say why avoid cluster-admin for the remote account
  source_readings:
  - sections/section-030/module-02/course-03-scoping-the-remote-account.md
  prompt: Why should the remote account not hold `cluster-admin`?
  options:
  - id: a
    text: Flux cannot use that role.
    explanation: Not correct. A narrow Role limits the damage of a leaked credential
      to one application.
  - id: b
    text: The role makes health checks fail.
    explanation: Not correct. A narrow Role limits the damage of a leaked credential
      to one application.
  - id: c
    text: The role cannot be bound to a ServiceAccount.
    explanation: Not correct. A narrow Role limits the damage of a leaked credential
      to one application.
  - id: d
    text: A leak of its token would give control of the whole remote cluster.
    explanation: Correct. A narrow Role limits the damage of a leaked credential to
      one application.
  correct_option: d
  explanation: Correct. A narrow Role limits the damage of a leaked credential to
    one application.
- id: ats099-030-q31
  type: single_choice
  difficulty: intermediate
  learning_objective: List the verbs Flux needs
  source_readings:
  - sections/section-030/module-02/course-03-scoping-the-remote-account.md
  prompt: Which verbs does the account need on the kinds in the folder to apply, health-check
    and prune?
  options:
  - id: a
    text: Only `create` and `update`.
    explanation: Not correct. Server-side apply needs `get`, `create`, `patch`; health
      checks need `list` and `watch`; pruning needs `delete`.
  - id: b
    text: Only `get` and `list`.
    explanation: Not correct. Server-side apply needs `get`, `create`, `patch`; health
      checks need `list` and `watch`; pruning needs `delete`.
  - id: c
    text: "`get`, `list`, `watch`, `create`, `update`, `patch` and `delete`"
    explanation: Correct. Server-side apply needs `get`, `create`, `patch`; health
      checks need `list` and `watch`; pruning needs `delete`.
  - id: d
    text: "`create` and `delete`, since `patch` is not used."
    explanation: Not correct. Server-side apply needs `get`, `create`, `patch`; health
      checks need `list` and `watch`; pruning needs `delete`.
  correct_option: c
  explanation: Correct. Server-side apply needs `get`, `create`, `patch`; health checks
    need `list` and `watch`; pruning needs `delete`.
- id: ats099-030-q32
  type: single_choice
  difficulty: intermediate
  learning_objective: Know what a Role cannot cover
  source_readings:
  - sections/section-030/module-02/course-03-scoping-the-remote-account.md
  prompt: Why can an account limited by a Role not create the namespace `podinfo-staging`?
