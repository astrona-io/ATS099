  - sections/section-030/module-03/course-01-push-and-pull-delivery.md
  prompt: A cluster must keep converging when the network to the management cluster
    is down. Which layout fits?
  options:
  - id: a
    text: A management cluster with `spec.kubeConfig`.
    explanation: Not correct. A local Flux only needs Git and keeps working when the
