  explanation: 'Correct. The simplicity is the risk: a copy of it works for years.'
- id: ats099-030-q26
  type: single_choice
  difficulty: intermediate
  learning_objective: Create a short-lived token
  source_readings:
  - sections/section-030/module-02/course-02-token-lifetime-and-rotation.md
  prompt: Which command creates a token for `flux-deployer` that expires?
  options:
  - id: a
    text: "`kubectl -n staging-access get token flux-deployer --expires=24h`"
    explanation: Not correct. The TokenRequest API issues the token, and something
      must renew it before it ends.
  - id: b
    text: "`kubectl -n staging-access create secret token flux-deployer`"
    explanation: Not correct. The TokenRequest API issues the token, and something
      must renew it before it ends.
  - id: c
    text: "`flux create token flux-deployer --duration=24h`"
    explanation: Not correct. The TokenRequest API issues the token, and something
      must renew it before it ends.
  - id: d
    text: "`kubectl -n staging-access create token flux-deployer --duration=24h`"
    explanation: Correct. The TokenRequest API issues the token, and something must
      renew it before it ends.
  correct_option: d
  explanation: Correct. The TokenRequest API issues the token, and something must
    renew it before it ends.
- id: ats099-030-q27
  type: single_choice
  difficulty: intermediate
  learning_objective: Order a rotation with no gap
  source_readings:
  - sections/section-030/module-02/course-02-token-lifetime-and-rotation.md
  prompt: What is the right order to rotate a token with no gap?
  options:
  - id: a
    text: Delete the old token, then create the new token.
    explanation: Not correct. The old token must stay until the new kubeconfig works,
      and must be gone at the end.
  - id: b
    text: Replace the Secret key, then create the new token.
    explanation: Not correct. The old token must stay until the new kubeconfig works,
      and must be gone at the end.
  - id: c
    text: Create the new token, build and test the kubeconfig, replace the Secret
      key, reconcile, then delete the old token.
    explanation: Correct. The old token must stay until the new kubeconfig works,
      and must be gone at the end.
  - id: d
    text: Create the new token, delete the old one, then replace the Secret key.
    explanation: Not correct. The old token must stay until the new kubeconfig works,
      and must be gone at the end.
  correct_option: c
  explanation: Correct. The old token must stay until the new kubeconfig works, and
    must be gone at the end.
- id: ats099-030-q28
  type: single_choice
  difficulty: intermediate
  learning_objective: Prove an old token is dead
  source_readings:
  - sections/section-030/module-02/course-02-token-lifetime-and-rotation.md
  prompt: Which API tells you whether the API server still accepts a token?
  options:
  - id: a
