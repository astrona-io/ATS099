# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats099-030
course_id: ATS099
exam_code: FLUX
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-030
  title: Cross-Namespace References And Remote Clusters
placement:
  position: after
  reading: sections/section-030/capstone/labs/lab-01/question.md
questions:
- id: ats099-030-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Describe sourceRef.namespace
  source_readings:
  - sections/section-030/module-01/course-01-cross-namespace-references.md
  prompt: What does sourceRef.namespace do on a Flux Kustomization?
  options:
  - id: a
    text: It creates the source in that namespace.
    explanation: Not correct. It only points at an existing source.
  - id: b
    text: It sets the namespace the objects are applied to.
    explanation: Not correct. targetNamespace does that.
  - id: c
    text: It makes Flux look for the source in that namespace instead of the Kustomization's
      own.
    explanation: Correct. Without it, Flux uses the object's own namespace.
  - id: d
    text: It copies the source to every namespace.
    explanation: Not correct. Nothing is copied.
  correct_option: c
  explanation: Correct. Without it, Flux uses the object's own namespace.
- id: ats099-030-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the cross-namespace risk
  source_readings:
  - sections/section-030/module-01/course-01-cross-namespace-references.md
  prompt: Why does a shared platform forbid cross-namespace references?
  options:
  - id: a
    text: They make source-controller crash.
    explanation: Not correct. The risk is access, not stability.
  - id: b
    text: They are not supported by Flux.
    explanation: Not correct. They work by default.
  - id: c
    text: They double the storage of every artifact.
    explanation: Not correct. They save a fetch.
  - id: d
    text: A team could point at the platform's GitRepository and apply folders that
      are not theirs.
    explanation: Correct. That source holds the whole platform repository.
  correct_option: d
  explanation: Correct. That source holds the whole platform repository.
- id: ats099-030-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Name the lockdown flag
  source_readings:
  - sections/section-030/module-01/course-01-cross-namespace-references.md
  prompt: Which flag refuses references to other namespaces?
  options:
  - id: a
    text: "--no-cross-namespace-refs=true"
    explanation: Correct. It is part of the multi-tenancy lockdown.
  - id: b
    text: "--no-remote-bases=true"
    explanation: Not correct. It stops remote Kustomize bases.
  - id: c
    text: "--default-service-account=default"
    explanation: Not correct. It sets the account used when none is named.
  - id: d
    text: "--log-level=debug"
    explanation: Not correct. It only raises the log detail.
  correct_option: a
  explanation: Correct. It is part of the multi-tenancy lockdown.
- id: ats099-030-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: List what the flag covers
  source_readings:
  - sections/section-030/module-01/course-01-cross-namespace-references.md
  prompt: Besides sourceRef, what else does --no-cross-namespace-refs=true refuse?
  options:
  - id: a
    text: Only sourceRef.
    explanation: Not correct. It covers more reference fields.
  - id: b
    text: dependsOn and Alert event sources in other namespaces.
    explanation: Correct. The flag covers all references that cross namespaces.
  - id: c
    text: Every secretRef in any namespace.
    explanation: Not correct. A secretRef already looks only in the object's own namespace.
  - id: d
    text: Network traffic between pods.
    explanation: Not correct. Flux flags do not filter pod traffic.
  correct_option: b
  explanation: Correct. The flag covers all references that cross namespaces.
- id: ats099-030-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Name the remote cluster field
  source_readings:
  - sections/section-030/module-01/course-02-applying-to-a-remote-cluster.md
  prompt: Which field makes a Flux Kustomization apply to another cluster?
  options:
  - id: a
    text: spec.serviceAccountName
    explanation: Not correct. It selects the account to impersonate in the same cluster.
  - id: b
    text: spec.targetNamespace
    explanation: Not correct. It sets a namespace.
  - id: c
    text: spec.sourceRef
    explanation: Not correct. It selects the source.
  - id: d
    text: spec.kubeConfig.secretRef
    explanation: Correct. It names the Secret that holds the kubeconfig.
  correct_option: d
  explanation: Correct. It names the Secret that holds the kubeconfig.
- id: ats099-030-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Split the work between clusters
  source_readings:
  - sections/section-030/module-01/course-02-applying-to-a-remote-cluster.md
  prompt: With spec.kubeConfig set, which part goes through the kubeconfig?
  options:
  - id: a
    text: Only the apply. Fetching and building stay on the cluster that runs Flux.
    explanation: Correct. source-controller and kustomize-controller still run locally.
  - id: b
    text: Fetching, building and applying.
    explanation: Not correct. Only the apply goes to the remote cluster.
  - id: c
    text: Only the fetch of the Git source.
    explanation: Not correct. The fetch is local.
  - id: d
    text: Only the build with Kustomize.
    explanation: Not correct. The build is local.
  correct_option: a
  explanation: Correct. source-controller and kustomize-controller still run locally.
- id: ats099-030-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Know the default Secret key
  source_readings:
  - sections/section-030/module-01/course-02-applying-to-a-remote-cluster.md
  prompt: Which key of the kubeconfig Secret does Flux read by default?
  options:
  - id: a
    text: kubeconfig
    explanation: Not correct. Flux does not look for that key by default.
  - id: b
    text: value (or value.yaml).
    explanation: Correct. Another key needs secretRef.key.
  - id: c
    text: config
    explanation: Not correct. That is the file name kubectl uses, not the Secret key.
  - id: d
    text: token
    explanation: Not correct. token holds a ServiceAccount token, not a kubeconfig.
  correct_option: b
  explanation: Correct. Another key needs secretRef.key.
- id: ats099-030-q08
  type: single_choice
  difficulty: advanced
  learning_objective: Predict a failed apply
  source_readings:
  - sections/section-030/module-01/course-02-applying-to-a-remote-cluster.md
  prompt: The remote account may only change the namespace podinfo-staging. The delivered
    folder contains a Namespace object. What happens?
  options:
  - id: a
    text: Flux creates the Namespace with its own rights.
    explanation: Not correct. The apply uses the account in the kubeconfig.
  - id: b
    text: Flux skips the Namespace object.
    explanation: Not correct. It tries to apply it and fails.
  - id: c
    text: The apply fails, because the account cannot create namespaces.
    explanation: Correct. Create the namespace when the cluster is set up.
  - id: d
    text: The account is promoted to cluster-admin.
    explanation: Not correct. Rights never change by themselves.
  correct_option: c
  explanation: Correct. Create the namespace when the cluster is set up.
- id: ats099-030-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Name the Cluster API Secret
  source_readings:
  - sections/section-030/module-01/course-03-cluster-api-and-fleets.md
  prompt: Cluster API creates a cluster named staging in the namespace clusters. Which
    Secret does it write for Flux?
  options:
  - id: a
    text: staging-token in flux-system.
    explanation: Not correct. Cluster API writes into the Cluster's namespace.
  - id: b
    text: staging-kubeconfig in the namespace clusters, with the kubeconfig under
      the key value.
    explanation: Correct. Put the Flux Kustomization in the same namespace.
  - id: c
    text: kubeconfig-staging in kube-system.
    explanation: Not correct. The name is <cluster>-kubeconfig.
  - id: d
    text: No Secret. Flux reads the Cluster object directly.
    explanation: Not correct. Flux needs the Secret.
  correct_option: b
  explanation: Correct. Put the Flux Kustomization in the same namespace.
- id: ats099-030-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Compare the two layouts
  source_readings:
  - sections/section-030/module-01/course-03-cluster-api-and-fleets.md
  prompt: In the hub and spoke layout, what does the management cluster hold that
    a standalone setup does not?
  options:
  - id: a
    text: A copy of every cluster's data.
    explanation: Not correct. Flux does not hold data.
  - id: b
    text: The controllers of every workload cluster.
    explanation: Not correct. Workload clusters run no Flux, and the controllers stay
      on the hub.
  - id: c
    text: A credential for every workload cluster.
    explanation: Correct. Protect the management cluster like the most sensitive one.
  - id: d
    text: Nothing extra, because kubeconfigs live in Git.
    explanation: Not correct. A kubeconfig is a Secret, never in Git.
  correct_option: c
  explanation: Correct. Protect the management cluster like the most sensitive one.
