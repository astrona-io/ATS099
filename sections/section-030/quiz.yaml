  options:
  - id: a
    text: The cleanup needs the kubeconfig to reach the remote cluster and cannot
      run.
    explanation: Correct. Restore the Secret, or set `deletionPolicy` to `Orphan`
      before the delete and accept that objects stay.
  - id: b
    text: The finalizer belongs to the GitRepository.
    explanation: Not correct. Restore the Secret, or set `deletionPolicy` to `Orphan`
      before the delete and accept that objects stay.
  - id: c
    text: The prune label is set on the Secret.
    explanation: Not correct. Restore the Secret, or set `deletionPolicy` to `Orphan`
      before the delete and accept that objects stay.
  - id: d
    text: The remote cluster is suspended.
    explanation: Not correct. Restore the Secret, or set `deletionPolicy` to `Orphan`
      before the delete and accept that objects stay.
  correct_option: a
  explanation: Correct. Restore the Secret, or set `deletionPolicy` to `Orphan` before
    the delete and accept that objects stay.
- id: ats099-030-q38
