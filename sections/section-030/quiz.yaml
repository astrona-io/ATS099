  explanation: Correct. The annotation excludes one object from pruning.
- id: ats099-030-q36
  type: single_choice
  difficulty: intermediate
  learning_objective: Say what deleting a pruning Kustomization does
  source_readings:
  - sections/section-030/module-02/course-04-remote-health-checks-and-pruning.md
  prompt: 'What happens to the remote objects when a Kustomization with `prune: true`
    is deleted and `deletionPolicy` is not set?'
  options:
  - id: a
    text: They stay, as the Kustomization is only an object.
    explanation: Not correct. The default `MirrorPrune` deletes when `prune` is true.
      `Orphan` keeps the objects.
  - id: b
    text: They are removed from the remote cluster, using the kubeconfig.
    explanation: Correct. The default `MirrorPrune` deletes when `prune` is true.
      `Orphan` keeps the objects.
  - id: c
    text: They move to the management cluster.
    explanation: Not correct. The default `MirrorPrune` deletes when `prune` is true.
      `Orphan` keeps the objects.
  - id: d
    text: They are suspended.
    explanation: Not correct. The default `MirrorPrune` deletes when `prune` is true.
      `Orphan` keeps the objects.
  correct_option: b
  explanation: Correct. The default `MirrorPrune` deletes when `prune` is true. `Orphan`
    keeps the objects.
- id: ats099-030-q37
  type: single_choice
  difficulty: advanced
  learning_objective: Handle a missing kubeconfig on delete
  source_readings:
  - sections/section-030/module-02/course-04-remote-health-checks-and-pruning.md
  prompt: A pruning Kustomization is deleted after its kubeconfig Secret was removed,
