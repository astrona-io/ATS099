  - id: c
    text: "`Block`"
    explanation: Not correct. `Warn` returns a warning and allows the request. `Deny`
      rejects it and `Audit` records it.
  - id: d
    text: "`Warn`"
    explanation: Correct. `Warn` returns a warning and allows the request. `Deny`
