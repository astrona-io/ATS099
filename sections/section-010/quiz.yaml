- id: ats099-010-q31
  type: single_choice
  difficulty: intermediate
  learning_objective: Test a policy without storing an object
  source_readings:
  - sections/section-010/module-03/course-03-admission-policy-for-flux-objects.md
  prompt: Which command sends an object through admission without storing it?
  options:
  - id: a
    text: "`kubectl apply --dry-run=client -f file.yaml`"
    explanation: Not correct. A server-side dry run sends the request to the API server,
      so admission policies run. A client-side dry run never reaches the API server.
  - id: b
    text: "`kubectl diff --server-side -f file.yaml`"
    explanation: Not correct. A server-side dry run sends the request to the API server,
      so admission policies run. A client-side dry run never reaches the API server.
  - id: c
    text: "`kubectl apply --dry-run=server -f file.yaml`"
    explanation: Correct. A server-side dry run sends the request to the API server,
      so admission policies run. A client-side dry run never reaches the API server.
  - id: d
    text: "`flux diff kustomization`"
    explanation: Not correct. A server-side dry run sends the request to the API server,
      so admission policies run. A client-side dry run never reaches the API server.
  correct_option: c
  explanation: Correct. A server-side dry run sends the request to the API server,
    so admission policies run. A client-side dry run never reaches the API server.
