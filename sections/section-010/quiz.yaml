- id: ats099-010-q20
  type: single_choice
  difficulty: intermediate
  learning_objective: Say why each tenant has its own decryption key
  source_readings:
  - sections/section-010/module-02/course-03-network-isolation-and-tenant-secrets.md
  prompt: Why does each tenant get its own SOPS key?
  options:
  - id: a
    text: Because SOPS can only encrypt for one file per key.
    explanation: Not correct. With a shared key, any tenant allowed to reference it
      could read every tenant's secrets. A separate key in each namespace prevents
      that.
  - id: b
    text: So one tenant cannot decrypt another tenant's secrets.
    explanation: Correct. With a shared key, any tenant allowed to reference it could
      read every tenant's secrets. A separate key in each namespace prevents that.
  - id: c
    text: Because kustomize-controller supports only one key per cluster.
    explanation: Not correct. With a shared key, any tenant allowed to reference it
      could read every tenant's secrets. A separate key in each namespace prevents
      that.
  - id: d
    text: Because age keys expire when shared.
    explanation: Not correct. With a shared key, any tenant allowed to reference it
      could read every tenant's secrets. A separate key in each namespace prevents
      that.
  correct_option: b
  explanation: Correct. With a shared key, any tenant allowed to reference it could
    read every tenant's secrets. A separate key in each namespace prevents that.
- id: ats099-010-q21
  type: single_choice
  difficulty: intermediate
  learning_objective: Offboard a tenant in the right order
  source_readings:
  - sections/section-010/module-02/course-04-onboarding-and-offboarding-tenants.md
  prompt: What is the safe way to offboard a tenant whose namespace holds Flux objects
    that prune?
  options:
  - id: a
    text: Remove the tenant's Flux objects first and the ServiceAccount, RoleBinding
      and Namespace in a later commit.
    explanation: Correct. The tenant's Kustomization prunes as the tenant's ServiceAccount.
      If that account or its rights disappear first, the cleanup is refused and the
      namespace can stay in Terminating.
  - id: b
    text: Delete the whole tenant folder in one commit with `--force`.
    explanation: Not correct. The tenant's Kustomization prunes as the tenant's ServiceAccount.
      If that account or its rights disappear first, the cleanup is refused and the
      namespace can stay in Terminating.
  - id: c
    text: Delete the RoleBinding first and the Flux objects last.
    explanation: Not correct. The tenant's Kustomization prunes as the tenant's ServiceAccount.
      If that account or its rights disappear first, the cleanup is refused and the
      namespace can stay in Terminating.
  - id: d
    text: Delete the Namespace with `kubectl delete` and keep the folder.
    explanation: Not correct. The tenant's Kustomization prunes as the tenant's ServiceAccount.
      If that account or its rights disappear first, the cleanup is refused and the
      namespace can stay in Terminating.
  correct_option: a
  explanation: Correct. The tenant's Kustomization prunes as the tenant's ServiceAccount.
    If that account or its rights disappear first, the cleanup is refused and the
    namespace can stay in Terminating.
- id: ats099-010-q22
  type: single_choice
  difficulty: beginner
