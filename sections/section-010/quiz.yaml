- id: ats099-010-q23
  type: single_choice
  difficulty: beginner
  learning_objective: Choose a repository layout that matches ownership
  source_readings:
  - sections/section-010/module-03/course-01-repository-layouts.md
  prompt: Which layout matches Git permissions to ownership in a cluster shared by
    teams?
  options:
  - id: a
    text: One repository for everything, writable by all teams.
    explanation: Not correct. Git permissions are set per repository or branch. A
      platform repository plus a repository per tenant lets the tenant push to its
      own repository only.
  - id: b
    text: One repository per environment, writable by all teams.
    explanation: Not correct. Git permissions are set per repository or branch. A
      platform repository plus a repository per tenant lets the tenant push to its
      own repository only.
  - id: c
    text: One platform repository owned by the platform team and one repository per
      tenant.
    explanation: Correct. Git permissions are set per repository or branch. A platform
      repository plus a repository per tenant lets the tenant push to its own repository
      only.
  - id: d
    text: One branch per tenant in the platform repository.
    explanation: Not correct. Git permissions are set per repository or branch. A
      platform repository plus a repository per tenant lets the tenant push to its
      own repository only.
  correct_option: c
  explanation: Correct. Git permissions are set per repository or branch. A platform
    repository plus a repository per tenant lets the tenant push to its own repository
    only.
- id: ats099-010-q24
