questions:
- id: ats099-010-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Say where tenant objects live
  source_readings:
  - sections/section-010/module-01/course-01-platform-and-tenant-repositories.md
  prompt: Which repository holds the Namespace, ServiceAccount and RoleBinding of
    a tenant?
  options:
  - id: a
    text: The platform repository.
    explanation: Correct. Whoever controls the RoleBinding controls the rights, so
      the platform owns it.
  - id: b
    text: The tenant's own repository.
    explanation: Not correct. A tenant that controls its own RoleBinding controls
      its own rights.
  - id: c
    text: Both repositories, with a copy in each.
    explanation: Not correct. One copy in the platform repository is enough and is
      the one that counts.
  - id: d
    text: None. Flux creates them without Git.
    explanation: Not correct. Flux only applies what its sources hold.
  correct_option: a
  explanation: Correct. Whoever controls the RoleBinding controls the rights, so the
    platform owns it.
- id: ats099-010-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the scope of a RoleBinding
  source_readings:
  - sections/section-010/module-01/course-01-platform-and-tenant-repositories.md
  prompt: A RoleBinding in the namespace team-a binds the ClusterRole cluster-admin
    to the ServiceAccount team-a. What rights does the account get?
  options:
  - id: a
    text: Every right in the whole cluster.
    explanation: Not correct. That needs a ClusterRoleBinding.
  - id: b
    text: Every right inside the namespace team-a and none outside it.
    explanation: Correct. A RoleBinding limits the rules of a ClusterRole to its own
      namespace.
  - id: c
    text: Read-only rights inside team-a.
    explanation: Not correct. cluster-admin is not read-only.
  - id: d
    text: No rights, because a RoleBinding cannot name cluster-admin.
    explanation: Not correct. A RoleBinding may reference a ClusterRole.
  correct_option: b
  explanation: Correct. A RoleBinding limits the rules of a ClusterRole to its own
    namespace.
- id: ats099-010-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain targetNamespace on a tenant Kustomization
  source_readings:
  - sections/section-010/module-01/course-01-platform-and-tenant-repositories.md
  prompt: 'Why does the tenant''s Flux Kustomization set targetNamespace: team-a?'
  options:
  - id: a
    text: To make the Kustomization reconcile faster.
    explanation: Not correct. Speed is set by interval.
  - id: b
    text: To choose which ServiceAccount Flux impersonates.
    explanation: Not correct. spec.serviceAccountName does that.
  - id: c
    text: So the platform, not the tenant's files, decides which namespace the objects
      land in.
    explanation: Correct. Flux sets the namespace before it applies, whatever the
      files say.
  - id: d
    text: To create the Namespace object when it is missing.
    explanation: Not correct. The Namespace has its own object in the platform repository.
  correct_option: c
  explanation: Correct. Flux sets the namespace before it applies, whatever the files
    say.
- id: ats099-010-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Describe impersonation
  source_readings:
  - sections/section-010/module-01/course-02-impersonation-with-service-accounts.md
  prompt: What happens when a Flux Kustomization sets spec.serviceAccountName?
  options:
  - id: a
    text: Flux copies the ServiceAccount token into the tenant's repository.
    explanation: Not correct. Flux never writes tokens to Git.
  - id: b
    text: The API server checks the controller's permissions and only logs the account
      name.
    explanation: Not correct. The check uses the account, not the controller.
  - id: c
    text: Flux starts a separate pod under that ServiceAccount for each file.
    explanation: Not correct. kustomize-controller itself sends the requests.
  - id: d
    text: kustomize-controller sends every object to the API server as that ServiceAccount,
      so RBAC checks the account's permissions.
    explanation: Correct. The API server judges the request by the named account.
  correct_option: d
  explanation: Correct. The API server judges the request by the named account.
- id: ats099-010-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Find the ServiceAccount namespace
  source_readings:
  - sections/section-010/module-01/course-02-impersonation-with-service-accounts.md
  prompt: 'A Flux Kustomization in the namespace flux-system sets serviceAccountName:
    team-a. Which ServiceAccount does Flux look up?'
  options:
  - id: a
    text: team-a/team-a.
    explanation: Not correct. Flux does not look in a namespace that is not the Kustomization's
      own.
  - id: b
    text: flux-system/team-a.
    explanation: Correct. Flux looks in the namespace of the Flux Kustomization.
  - id: c
    text: flux-system/default.
    explanation: Not correct. default is used only when no name is set and the lockdown
      flag is on.
  - id: d
    text: kube-system/team-a.
    explanation: Not correct. Flux never uses kube-system for this lookup.
  correct_option: b
  explanation: Correct. Flux looks in the namespace of the Flux Kustomization.
- id: ats099-010-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Read a refusal from RBAC
  source_readings:
  - sections/section-010/module-01/course-02-impersonation-with-service-accounts.md
  prompt: The Kustomization team-a-escalate shows Ready False with a forbidden message
    for a ClusterRole. What produced the refusal?
  options:
  - id: a
    text: A bug in kustomize-controller.
    explanation: Not correct. The controller reported what it was told.
  - id: b
    text: The GitRepository, which rejected the file.
    explanation: Not correct. A source only stores files.
  - id: c
    text: Kubernetes RBAC in the API server; kustomize-controller only reported it.
    explanation: Correct. The refusal came from the API server.
  - id: d
    text: notification-controller, which blocks cluster-wide objects.
    explanation: Not correct. It only sends events.
  correct_option: c
  explanation: Correct. The refusal came from the API server.
- id: ats099-010-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Check a tenant's rights
  source_readings:
  - sections/section-010/module-01/course-02-impersonation-with-service-accounts.md
  prompt: Which command checks whether the tenant's account may create ClusterRoles?
  options:
  - id: a
    text: kubectl auth can-i create clusterroles --as=team-a
    explanation: Not correct. That names a user called team-a, not the ServiceAccount.
  - id: b
    text: kubectl apply -f escalate/ with your own user
    explanation: Not correct. Your own user is not the tenant.
  - id: c
    text: flux get kustomization team-a -n team-a --can-i
    explanation: Not correct. flux get has no such option.
  - id: d
    text: kubectl auth can-i create clusterroles --as=system:serviceaccount:team-a:team-a
    explanation: Correct. The --as value names the ServiceAccount with its namespace.
  correct_option: d
  explanation: Correct. The --as value names the ServiceAccount with its namespace.
- id: ats099-010-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Name the default ServiceAccount flag
  source_readings:
  - sections/section-010/module-01/course-03-locking-down-the-cluster.md
  prompt: A tenant writes a Kustomization with no serviceAccountName. Which flag makes
    it run with no rights instead of cluster-admin?
  options:
  - id: a
    text: "--default-service-account=default"
    explanation: Correct. The object impersonates the empty default account in its
      namespace.
  - id: b
    text: "--no-remote-bases=true"
    explanation: Not correct. It stops Kustomize from pulling remote bases.
  - id: c
    text: "--no-cross-namespace-refs=true"
    explanation: Not correct. It limits references to the object's own namespace.
  - id: d
    text: "--log-level=error"
    explanation: Not correct. It only changes the log output.
  correct_option: a
  explanation: Correct. The object impersonates the empty default account in its namespace.
- id: ats099-010-q09
  type: single_choice
  difficulty: advanced
  learning_objective: Explain the effect on platform objects
  source_readings:
  - sections/section-010/module-01/course-03-locking-down-the-cluster.md
  prompt: The flag --default-service-account=default is on, and a platform Kustomization
    in flux-system has no serviceAccountName. What happens?
  options:
  - id: a
    text: It keeps running as cluster-admin.
    explanation: Not correct. The flag applies to every object without a name.
  - id: b
    text: Flux skips the flag for objects in flux-system.
    explanation: Not correct. There is no such exception.
  - id: c
    text: Flux deletes the Kustomization.
    explanation: Not correct. It stays and reports an error.
  - id: d
    text: It runs as flux-system/default, which has no rights, and fails.
    explanation: Correct. Platform Kustomizations must name kustomize-controller.
  correct_option: d
  explanation: Correct. Platform Kustomizations must name kustomize-controller.
- id: ats099-010-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Place the lockdown patches
  source_readings:
  - sections/section-010/module-01/course-03-locking-down-the-cluster.md
  prompt: Why do you add the flag patches in clusters/kind/flux-system/kustomization.yaml
    and not in gotk-components.yaml?
  options:
  - id: a
    text: flux bootstrap rewrites gotk-components.yaml on every upgrade, so the change
      would be lost.
    explanation: Correct. The Kustomize file next to it is left alone after the first
      bootstrap.
  - id: b
    text: gotk-components.yaml is read-only in Git.
    explanation: Not correct. It is an ordinary file.
  - id: c
    text: The controllers ignore flags in gotk-components.yaml.
    explanation: Not correct. The file only holds the Deployments.
  - id: d
    text: Kustomize cannot read gotk-components.yaml.
    explanation: Not correct. It is listed as a resource.
  correct_option: a
  explanation: Correct. The Kustomize file next to it is left alone after the first
    bootstrap.
- id: ats099-010-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Name the controllers that need the default ServiceAccount flag
  source_readings:
  - sections/section-010/module-01/course-04-impersonation-in-helm-and-other-controllers.md
  prompt: On which controllers must `--default-service-account=default` be set so
    that no tenant object runs with controller rights?
  options:
  - id: a
    text: kustomize-controller only
    explanation: Not correct. Both kustomize-controller and helm-controller apply
      tenant objects, so both need the flag. Setting only one leaves the other running
      objects without a ServiceAccount as itself.
  - id: b
    text: source-controller and notification-controller
    explanation: Not correct. Both kustomize-controller and helm-controller apply
      tenant objects, so both need the flag. Setting only one leaves the other running
      objects without a ServiceAccount as itself.
  - id: c
    text: kustomize-controller and helm-controller
    explanation: Correct. Both kustomize-controller and helm-controller apply tenant
      objects, so both need the flag. Setting only one leaves the other running objects
      without a ServiceAccount as itself.
  - id: d
    text: helm-controller only
    explanation: Not correct. Both kustomize-controller and helm-controller apply
      tenant objects, so both need the flag. Setting only one leaves the other running
      objects without a ServiceAccount as itself.
  correct_option: c
  explanation: Correct. Both kustomize-controller and helm-controller apply tenant
    objects, so both need the flag. Setting only one leaves the other running objects
    without a ServiceAccount as itself.
- id: ats099-010-q12
  type: single_choice
  difficulty: beginner
  learning_objective: Find the cause of a refusal with kubectl auth can-i
  source_readings:
  - sections/section-010/module-01/course-05-reading-and-fixing-refusals.md
  prompt: Which command shows whether the ServiceAccount `team-a` in `team-a` may
    create Deployments in its namespace?
  options:
  - id: a
    text: "`kubectl get rolebinding -A --as=team-a`"
    explanation: Not correct. `kubectl auth can-i` with `--as` evaluates the request
      as the named account, which is the account Flux impersonates.
  - id: b
    text: "`kubectl auth can-i create deployments -n team-a --as=system:serviceaccount:team-a:team-a`"
    explanation: Correct. `kubectl auth can-i` with `--as` evaluates the request as
      the named account, which is the account Flux impersonates.
  - id: c
    text: "`flux get kustomizations -n team-a --as=team-a`"
    explanation: Not correct. `kubectl auth can-i` with `--as` evaluates the request
      as the named account, which is the account Flux impersonates.
  - id: d
    text: "`kubectl describe serviceaccount team-a -n team-a --as=cluster-admin`"
    explanation: Not correct. `kubectl auth can-i` with `--as` evaluates the request
      as the named account, which is the account Flux impersonates.
  correct_option: b
  explanation: Correct. `kubectl auth can-i` with `--as` evaluates the request as
    the named account, which is the account Flux impersonates.
- id: ats099-010-q13
  type: single_choice
  difficulty: beginner
  learning_objective: Say what a RoleBinding to cluster-admin allows
  source_readings:
  - sections/section-010/module-02/course-01-choosing-the-tenant-role.md
  prompt: A RoleBinding in `team-a` names the ClusterRole `cluster-admin`. Which statement
    is correct?
  options:
  - id: a
    text: The account may do everything to namespaced objects in `team-a`, and nothing
      in other namespaces.
    explanation: Correct. A RoleBinding scopes the rules of any ClusterRole to its
      own namespace, so the rules of `cluster-admin` apply only in `team-a`.
  - id: b
    text: The account may do everything in every namespace.
    explanation: Not correct. A RoleBinding scopes the rules of any ClusterRole to
      its own namespace, so the rules of `cluster-admin` apply only in `team-a`.
  - id: c
    text: The account may only read objects in `team-a`.
    explanation: Not correct. A RoleBinding scopes the rules of any ClusterRole to
      its own namespace, so the rules of `cluster-admin` apply only in `team-a`.
  - id: d
    text: The binding has no effect because `cluster-admin` is a cluster role.
    explanation: Not correct. A RoleBinding scopes the rules of any ClusterRole to
      its own namespace, so the rules of `cluster-admin` apply only in `team-a`.
  correct_option: a
  explanation: Correct. A RoleBinding scopes the rules of any ClusterRole to its own
    namespace, so the rules of `cluster-admin` apply only in `team-a`.
- id: ats099-010-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: Say why the admin ClusterRole protects a quota
  source_readings:
  - sections/section-010/module-02/course-01-choosing-the-tenant-role.md
  prompt: Why is the ClusterRole `admin` a better tenant role than `cluster-admin`
    when the platform sets a ResourceQuota?
  options:
  - id: a
    text: "`admin` hides the ResourceQuota from the tenant."
    explanation: Not correct. The built-in `admin` role has only get, list and watch
      on resource quotas, while `cluster-admin` allows every verb.
  - id: b
    text: "`admin` blocks Deployments above the quota."
    explanation: Not correct. The built-in `admin` role has only get, list and watch
      on resource quotas, while `cluster-admin` allows every verb.
  - id: c
    text: "`admin` cannot be bound with a RoleBinding."
    explanation: Not correct. The built-in `admin` role has only get, list and watch
      on resource quotas, while `cluster-admin` allows every verb.
  - id: d
    text: "`admin` allows only reading a ResourceQuota, so the tenant cannot change
      or delete it."
    explanation: Correct. The built-in `admin` role has only get, list and watch on
      resource quotas, while `cluster-admin` allows every verb.
  correct_option: d
  explanation: Correct. The built-in `admin` role has only get, list and watch on
    resource quotas, while `cluster-admin` allows every verb.
- id: ats099-010-q15
  type: single_choice
  difficulty: intermediate
  learning_objective: Change a RoleBinding through Git
  source_readings:
  - sections/section-010/module-02/course-01-choosing-the-tenant-role.md
  prompt: A RoleBinding in Git points at `cluster-admin`. How do you switch it to
    `admin` through Flux?
  options:
  - id: a
    text: Change `roleRef.name` in the same object and push.
    explanation: Not correct. The `roleRef` field of a RoleBinding is immutable, so
      an update in place is refused. A new name creates a new object, and pruning
      removes the old one.
  - id: b
    text: Patch the RoleBinding with `kubectl edit`.
    explanation: Not correct. The `roleRef` field of a RoleBinding is immutable, so
      an update in place is refused. A new name creates a new object, and pruning
      removes the old one.
  - id: c
    text: Give the new RoleBinding a new name with `roleRef` set to `admin`, remove
      the old one, and let pruning delete the old one.
    explanation: Correct. The `roleRef` field of a RoleBinding is immutable, so an
      update in place is refused. A new name creates a new object, and pruning removes
      the old one.
  - id: d
    text: 'Add `spec.suspend: true` to the RoleBinding.'
    explanation: Not correct. The `roleRef` field of a RoleBinding is immutable, so
      an update in place is refused. A new name creates a new object, and pruning
      removes the old one.
  correct_option: c
  explanation: Correct. The `roleRef` field of a RoleBinding is immutable, so an update
    in place is refused. A new name creates a new object, and pruning removes the
    old one.
- id: ats099-010-q16
  type: single_choice
  difficulty: beginner
  learning_objective: Say what a ResourceQuota limits
  source_readings:
  - sections/section-010/module-02/course-02-quotas-and-limits.md
  prompt: 'What does a ResourceQuota with `pods: "10"` in the namespace `team-a` do?'
  options:
  - id: a
    text: It limits each Deployment to 10 replicas in all namespaces.
    explanation: Not correct. A ResourceQuota is a hard cap on the total for one namespace,
      and the API server refuses requests that exceed it.
  - id: b
    text: It makes the API server refuse the creation of an 11th pod in `team-a`.
    explanation: Correct. A ResourceQuota is a hard cap on the total for one namespace,
      and the API server refuses requests that exceed it.
  - id: c
    text: It limits `team-a` to 10 nodes.
    explanation: Not correct. A ResourceQuota is a hard cap on the total for one namespace,
      and the API server refuses requests that exceed it.
  - id: d
    text: It deletes pods that run longer than 10 minutes.
    explanation: Not correct. A ResourceQuota is a hard cap on the total for one namespace,
      and the API server refuses requests that exceed it.
  correct_option: b
  explanation: Correct. A ResourceQuota is a hard cap on the total for one namespace,
    and the API server refuses requests that exceed it.
- id: ats099-010-q17
  type: single_choice
  difficulty: intermediate
  learning_objective: Say why a LimitRange goes with a compute quota
  source_readings:
  - sections/section-010/module-02/course-02-quotas-and-limits.md
  prompt: A ResourceQuota sets `requests.cpu`. Why add a LimitRange with default requests?
  options:
  - id: a
    text: Pods that declare no CPU request are rejected under that quota, and the
      defaults give them one.
    explanation: Correct. When a quota counts a compute resource, every pod must declare
      it. The LimitRange fills in a default so pods are accepted.
  - id: b
    text: The LimitRange makes the quota apply to other namespaces.
    explanation: Not correct. When a quota counts a compute resource, every pod must
      declare it. The LimitRange fills in a default so pods are accepted.
  - id: c
    text: The LimitRange raises the quota when it is full.
    explanation: Not correct. When a quota counts a compute resource, every pod must
      declare it. The LimitRange fills in a default so pods are accepted.
  - id: d
    text: The LimitRange deletes pods that exceed the quota.
    explanation: Not correct. When a quota counts a compute resource, every pod must
      declare it. The LimitRange fills in a default so pods are accepted.
  correct_option: a
  explanation: Correct. When a quota counts a compute resource, every pod must declare
    it. The LimitRange fills in a default so pods are accepted.
- id: ats099-010-q18
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe a default-deny NetworkPolicy
  source_readings:
  - sections/section-010/module-02/course-03-network-isolation-and-tenant-secrets.md
  prompt: Which NetworkPolicy blocks all incoming traffic to every pod in `team-a`?
  options:
  - id: a
    text: 'A policy with a `podSelector` that names no labels and `policyTypes: [Egress]`.'
    explanation: Not correct. An empty podSelector selects every pod. Listing Ingress
      with no ingress rules allows no incoming traffic.
  - id: b
    text: 'A policy with `ingress: [{}]` and no `policyTypes`.'
    explanation: Not correct. An empty podSelector selects every pod. Listing Ingress
      with no ingress rules allows no incoming traffic.
  - id: c
    text: 'A ResourceQuota with `networkpolicies: 0`.'
    explanation: Not correct. An empty podSelector selects every pod. Listing Ingress
      with no ingress rules allows no incoming traffic.
  - id: d
    text: 'A policy with `podSelector: {}`, `policyTypes: [Ingress]` and no `ingress`
      rules.'
    explanation: Correct. An empty podSelector selects every pod. Listing Ingress
      with no ingress rules allows no incoming traffic.
  correct_option: d
  explanation: Correct. An empty podSelector selects every pod. Listing Ingress with
    no ingress rules allows no incoming traffic.
