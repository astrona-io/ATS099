- id: ats099-010-q25
  type: single_choice
  difficulty: beginner
  learning_objective: Protect the watched branch
  source_readings:
  - sections/section-010/module-03/course-02-git-permissions-and-verified-sources.md
  prompt: Which Git server setting protects the branch Flux reads against rewritten
    history?
  options:
  - id: a
    text: Blocking force pushes on the branch.
    explanation: Correct. A force push can rewrite the history under Flux. Branch
      protection on the Git server blocks it.
  - id: b
    text: Using a longer `interval` on the GitRepository.
    explanation: Not correct. A force push can rewrite the history under Flux. Branch
      protection on the Git server blocks it.
  - id: c
    text: 'Setting `prune: false` on the Kustomization.'
    explanation: Not correct. A force push can rewrite the history under Flux. Branch
      protection on the Git server blocks it.
  - id: d
    text: Naming the branch `flux`.
    explanation: Not correct. A force push can rewrite the history under Flux. Branch
      protection on the Git server blocks it.
  correct_option: a
  explanation: Correct. A force push can rewrite the history under Flux. Branch protection
    on the Git server blocks it.
- id: ats099-010-q26
  type: single_choice
  difficulty: intermediate
  learning_objective: Verify commit signatures in a GitRepository
  source_readings:
  - sections/section-010/module-03/course-02-git-permissions-and-verified-sources.md
  prompt: Which `GitRepository` field makes source-controller check the signature
    of the latest commit?
  options:
  - id: a
    text: "`spec.ignore` with the signer name."
    explanation: 'Not correct. `spec.verify` with `mode: HEAD` checks the latest commit
      against the public keys in the referenced Secret.'
  - id: b
    text: "`spec.suspend: false`"
    explanation: 'Not correct. `spec.verify` with `mode: HEAD` checks the latest commit
      against the public keys in the referenced Secret.'
  - id: c
    text: "`spec.ref.signed: true`"
    explanation: 'Not correct. `spec.verify` with `mode: HEAD` checks the latest commit
      against the public keys in the referenced Secret.'
  - id: d
    text: "`spec.verify` with `mode: HEAD` and a `secretRef` to the public keys."
    explanation: 'Correct. `spec.verify` with `mode: HEAD` checks the latest commit
      against the public keys in the referenced Secret.'
  correct_option: d
  explanation: 'Correct. `spec.verify` with `mode: HEAD` checks the latest commit
    against the public keys in the referenced Secret.'
- id: ats099-010-q27
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe what happens when verification fails
  source_readings:
  - sections/section-010/module-03/course-02-git-permissions-and-verified-sources.md
  prompt: A `GitRepository` with `spec.verify` meets an unsigned commit. What happens?
  options:
  - id: a
    text: The commit is applied and a warning is logged.
    explanation: Not correct. Source-controller refuses to produce an artifact from
      a revision that fails verification, so what already runs keeps running.
  - id: b
    text: Flux deletes the objects the source created.
    explanation: Not correct. Source-controller refuses to produce an artifact from
      a revision that fails verification, so what already runs keeps running.
  - id: c
    text: No new artifact is produced, the old artifact stays, and the source shows
      `Ready` `False`.
    explanation: Correct. Source-controller refuses to produce an artifact from a
      revision that fails verification, so what already runs keeps running.
  - id: d
    text: The Kustomization is suspended and its objects are deleted.
    explanation: Not correct. Source-controller refuses to produce an artifact from
      a revision that fails verification, so what already runs keeps running.
  correct_option: c
  explanation: Correct. Source-controller refuses to produce an artifact from a revision
    that fails verification, so what already runs keeps running.
- id: ats099-010-q28
