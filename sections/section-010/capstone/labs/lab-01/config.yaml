# Repair A Tenant That Cannot Deploy
# Astrona graded capstone. Schema: internal/config.LabConfig.

metadata:
  name: "ats-099-capstone-010"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, starts Gitea, seeds the repositories and bootstraps Flux from gitops/fleet"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-099-capstone-010-setup"
      description: "Locks the controllers down, onboards team-a, and onboards team-b with three faults"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Gitea, the tester pod and the webhook receiver"
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-flux"
      description: "Waits for Gitea and the Flux controllers that exist"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-lockdown-in-git"
      description: "Passes when the lockdown patches are still in clusters/kind/flux-system/kustomization.yaml in Git"
      type: "file"
      source: "validation/validate-lockdown-in-git.sh"
    - name: "validate-lockdown-live"
      description: "Passes when the controllers still run with the lockdown flags and flux-system runs as kustomize-controller"
      type: "file"
      source: "validation/validate-lockdown-live.sh"
    - name: "validate-team-a-intact"
      description: "Passes when team-a still reconciles as team-a and podinfo still runs in team-a"
      type: "file"
      source: "validation/validate-team-a-intact.sh"
    - name: "validate-team-b-refused"
      description: "Passes when a Flux Kustomization that impersonates team-b cannot create a ClusterRole"
      type: "file"
      source: "validation/validate-team-b-refused.sh"
    - name: "validate-team-b-sync"
      description: "Passes when team-b's Flux Kustomization impersonates team-b from a source in team-b, is Ready, and podinfo runs in team-b"
      type: "file"
      source: "validation/validate-team-b-sync.sh"

teardown:
  keepCluster: false
