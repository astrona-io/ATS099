# Bring Flux Back After A Lost flux-system Namespace
# Astrona graded capstone. Schema: internal/config.LabConfig.

metadata:
  name: "ats-099-capstone-040"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, starts Gitea, seeds the repositories and bootstraps Flux from gitops/fleet"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-099-capstone-040-setup"
      description: "Adds private-config, commits a forgotten suspend, records UIDs, then uninstalls Flux with its namespace"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Gitea, the tester pod and the webhook receiver"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits for Gitea and the Flux controllers that exist"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-flux-check"
      description: "Passes when flux check reports the controllers and the CRDs as healthy"
      type: "file"
      source: "validation/validate-flux-check.sh"
    - name: "validate-podinfo-resumed"
      description: "Passes when podinfo is no longer suspended in Git or in the cluster, is Ready, and kept its Deployment UID"
      type: "file"
      source: "validation/validate-podinfo-resumed.sh"
    - name: "validate-private-config"
      description: "Passes when the private source and its Kustomization are Ready and the private-settings ConfigMap kept its UID"
      type: "file"
      source: "validation/validate-private-config.sh"
    - name: "validate-sync-restored"
      description: "Passes when flux-system syncs gitops/fleet at ./clusters/kind again and is Ready"
      type: "file"
      source: "validation/validate-sync-restored.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - mendhak/http-https-echo:42
      - nicolaka/netshoot:v0.13
