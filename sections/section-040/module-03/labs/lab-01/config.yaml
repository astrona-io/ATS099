# Tune kustomize-controller Through Git Lab
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-099-lab-040-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, starts Gitea, seeds the repositories and bootstraps Flux from gitops/fleet"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-099-lab-040-03-setup"
      description: "Checks that the Flux manifests are in Git and that kustomize-controller runs with its defaults"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Gitea, the tester pod and the webhook receiver"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits for Gitea and the Flux controllers that exist"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-concurrency"
      description: "Passes when kustomize-controller runs with --concurrent=8 exactly once after Flux applied what is in Git"
      type: "file"
      source: "validation/validate-concurrency.sh"
    - name: "validate-memory-limit"
      description: "Passes when the memory limit of kustomize-controller is 2Gi after Flux applied what is in Git"
      type: "file"
      source: "validation/validate-memory-limit.sh"
    - name: "validate-change-in-git"
      description: "Passes when the patches are in Git, flux-system is Ready, and only kustomize-controller changed"
      type: "file"
      source: "validation/validate-change-in-git.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - mendhak/http-https-echo:42
      - nicolaka/netshoot:v0.13
