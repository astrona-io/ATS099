# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
---
schema_version: 1
kind: question_bank
id: ats099-040
course_id: ATS099
exam_code: FLUX
status: alpha
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-040
  title: Disaster Recovery
placement:
  position: after
  reading: sections/section-040/capstone/labs/lab-01/question.md
questions:
- id: ats099-040-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Name what Git does not hold
  source_readings:
  - sections/section-040/module-01/course-01-what-git-does-not-hold.md
  prompt: Which item is not in Git and must be restored before Flux needs it?
  options:
  - id: a
    text: gotk-components.yaml.
    explanation: Not correct. It is in Git.
  - id: b
    text: A Flux Kustomization under clusters/kind.
    explanation: Not correct. Flux objects are in Git.
  - id: c
    text: gotk-sync.yaml.
    explanation: Not correct. It is in Git.
  - id: d
    text: The private key that decrypts SOPS-encrypted files.
    explanation: Correct. Flux can only apply what it can read and decrypt.
  correct_option: d
  explanation: Correct. Flux can only apply what it can read and decrypt.
- id: ats099-040-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Judge flux export as a backup
  source_readings:
  - sections/section-040/module-01/course-01-what-git-does-not-hold.md
  prompt: Is flux export a backup of the cluster?
  options:
  - id: a
    text: No. It exports Flux objects that are already in Git, never Secret values
      or data.
    explanation: Correct. Credentials and data need their own home.
  - id: b
    text: Yes. It exports Secrets and volumes.
    explanation: Not correct. It prints no Secret values.
  - id: c
    text: Yes, but only for Helm releases.
    explanation: Not correct. It covers Flux objects, not just Helm.
  - id: d
    text: No. It deletes the objects it exports.
    explanation: Not correct. It only prints YAML.
  correct_option: a
  explanation: Correct. Credentials and data need their own home.
- id: ats099-040-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Know what a recreated volume holds
  source_readings:
  - sections/section-040/module-01/course-01-what-git-does-not-hold.md
  prompt: Flux recreates a PersistentVolumeClaim from Git. What does the new volume
    hold?
  options:
  - id: a
    text: The data of the old volume.
    explanation: Not correct. Git holds no data.
  - id: b
    text: Nothing. Data comes back only from a backup tool.
    explanation: Correct. Flux never holds data.
  - id: c
    text: The last snapshot Flux made.
    explanation: Not correct. Flux makes no snapshots.
  - id: d
    text: A copy of the data in the Secret flux-system.
    explanation: Not correct. That Secret holds a Git credential.
  correct_option: b
  explanation: Correct. Flux never holds data.
- id: ats099-040-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Read the keys of the Git credential
  source_readings:
  - sections/section-040/module-01/course-01-what-git-does-not-hold.md
  prompt: A cluster was bootstrapped with token authentication. Which keys does the
    Secret flux-system hold?
  options:
  - id: a
    text: identity, identity.pub and known_hosts.
    explanation: Not correct. Those are the SSH keys.
  - id: b
    text: address and token.
    explanation: Not correct. Those are notification Provider keys.
  - id: c
    text: username and password.
    explanation: Correct. An SSH bootstrap holds identity, identity.pub and known_hosts
      instead.
  - id: d
    text: value and value.yaml.
    explanation: Not correct. Those are kubeconfig keys.
  correct_option: c
  explanation: Correct. An SSH bootstrap holds identity, identity.pub and known_hosts
    instead.
- id: ats099-040-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Know what suspend does
  source_readings:
  - sections/section-040/module-01/course-02-suspend-uninstall-and-reinstall.md
  prompt: What does flux suspend kustomization --all do?
  options:
  - id: a
    text: It stops reconciliation of every Kustomization in the namespace until it
      is resumed.
    explanation: Correct. The cluster stops following Git for them.
  - id: b
    text: It deletes every Kustomization.
    explanation: Not correct. The objects stay.
  - id: c
    text: It deletes everything they applied.
    explanation: Not correct. Nothing is pruned.
  - id: d
    text: It uninstalls the Flux controllers.
    explanation: Not correct. The controllers keep running.
  correct_option: a
  explanation: Correct. The cluster stops following Git for them.
- id: ats099-040-q06
  type: single_choice
  difficulty: advanced
  learning_objective: Explain a suspend that survives resume
  source_readings:
  - sections/section-040/module-01/course-02-suspend-uninstall-and-reinstall.md
  prompt: 'suspend: true is committed in Git. Why does flux resume not end it for
    long?'
  options:
  - id: a
    text: flux resume only works on HelmReleases.
    explanation: Not correct. It works on Kustomizations too.
  - id: b
    text: 'The next reconcile of flux-system applies suspend: true again.'
    explanation: Correct. Remove the line in Git.
  - id: c
    text: Kubernetes blocks resume for 24 hours.
    explanation: Not correct. There is no such delay.
  - id: d
    text: The Git credential has expired.
    explanation: Not correct. The cause is the file in Git.
  correct_option: b
  explanation: Correct. Remove the line in Git.
- id: ats099-040-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why uninstall keeps workloads
  source_readings:
  - sections/section-040/module-01/course-02-suspend-uninstall-and-reinstall.md
  prompt: Why does flux uninstall leave the workloads running?
  options:
  - id: a
    text: It copies the workloads to another namespace.
    explanation: Not correct. It does not copy anything.
  - id: b
    text: It only removes the Flux namespace.
    explanation: Not correct. It removes the controllers, the CRDs and the Flux objects.
  - id: c
    text: It removes the finalizers from Flux objects first, so no Kustomization prunes
      what it applied.
    explanation: 'Correct. Deleting a Kustomization with prune: true would delete
      them.'
  - id: d
    text: Workloads are never managed by Flux.
    explanation: Not correct. Flux applied and owned them.
  correct_option: c
  explanation: 'Correct. Deleting a Kustomization with prune: true would delete them.'
- id: ats099-040-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Prove adoption
  source_readings:
  - sections/section-040/module-01/course-02-suspend-uninstall-and-reinstall.md
  prompt: After reinstalling Flux, how do you prove podinfo was adopted and not recreated?
  options:
  - id: a
    text: The Deployment looks the same in kubectl get.
    explanation: Not correct. A recreated object looks the same.
  - id: b
    text: flux get shows Ready.
    explanation: Not correct. It does not tell adoption from recreation.
  - id: c
    text: The Git commit has a new revision.
    explanation: Not correct. The revision says nothing about the UID.
  - id: d
    text: The Deployment has the same UID as before the uninstall.
    explanation: Correct. A recreated object has a new UID.
  correct_option: d
  explanation: Correct. A recreated object has a new UID.
- id: ats099-040-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Order a rebuild
  source_readings:
  - sections/section-040/module-01/course-03-rebuilding-a-lost-cluster.md
  prompt: What comes right before flux bootstrap on a new cluster?
  options:
  - id: a
    text: Restoring data from backups.
    explanation: Not correct. Data comes after the applications.
  - id: b
    text: Verifying that every object is Ready.
    explanation: Not correct. Verification is last.
  - id: c
    text: Restoring the keys and credentials Flux needs.
    explanation: Correct. Flux retries forever, but objects behind a missing credential
      wait.
  - id: d
    text: Deleting the Git repository history.
    explanation: Not correct. Git is the source and stays.
  correct_option: c
  explanation: Correct. Flux retries forever, but objects behind a missing credential
    wait.
- id: ats099-040-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Find where application order lives
  source_readings:
  - sections/section-040/module-01/course-03-rebuilding-a-lost-cluster.md
  prompt: On a rebuilt cluster, what makes infrastructure apply before the applications
    that need it?
  options:
  - id: a
    text: The alphabetical order of the file names.
    explanation: Not correct. File names do not set the order.
  - id: b
    text: The order of the commands you type.
    explanation: Not correct. Flux applies by dependsOn.
  - id: c
    text: The age of each Kustomization.
    explanation: Not correct. Age has no effect.
  - id: d
    text: The dependsOn fields in Git.
    explanation: Correct. Nobody has to remember the order during the outage.
  correct_option: d
  explanation: Correct. Nobody has to remember the order during the outage.
- id: ats099-040-q11
  type: single_choice
  difficulty: beginner
  learning_objective: Triage a broken installation
  source_readings:
  - sections/section-040/module-01/course-04-reading-the-state-of-a-broken-flux.md
  prompt: Which command tests that the Flux controllers are ready and the custom resource
    definitions exist?
  options:
  - id: a
    text: "`flux get sources all -A`"
    explanation: Not correct. `flux check` also exits with a non-zero status when
      something is wrong, so it works in a script.
  - id: b
    text: "`flux export kustomization --all`"
    explanation: Not correct. `flux check` also exits with a non-zero status when
      something is wrong, so it works in a script.
  - id: c
    text: "`flux check`"
    explanation: Correct. `flux check` also exits with a non-zero status when something
      is wrong, so it works in a script.
  - id: d
    text: "`flux trace`"
    explanation: Not correct. `flux check` also exits with a non-zero status when
      something is wrong, so it works in a script.
  correct_option: c
  explanation: Correct. `flux check` also exits with a non-zero status when something
    is wrong, so it works in a script.
- id: ats099-040-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: Follow dependsOn to the cause
  source_readings:
  - sections/section-040/module-01/course-04-reading-the-state-of-a-broken-flux.md
  prompt: A Kustomization says 'dependency not ready'. Where do you start?
  options:
  - id: a
    text: With the Kustomization that shows the message.
    explanation: Not correct. The message on the waiting Kustomization is a symptom
      of another object.
  - id: b
    text: With the first Kustomization in the `dependsOn` chain that is not `Ready`.
    explanation: Correct. The message on the waiting Kustomization is a symptom of
      another object.
  - id: c
    text: With `flux uninstall`.
    explanation: Not correct. The message on the waiting Kustomization is a symptom
      of another object.
  - id: d
    text: With the controller that has the oldest pod.
    explanation: Not correct. The message on the waiting Kustomization is a symptom
      of another object.
  correct_option: b
  explanation: Correct. The message on the waiting Kustomization is a symptom of another
    object.
- id: ats099-040-q13
  type: single_choice
  difficulty: intermediate
  learning_objective: Know what removing a finalizer skips
  source_readings:
  - sections/section-040/module-01/course-04-reading-the-state-of-a-broken-flux.md
  prompt: 'What does removing a finalizer by hand from a Kustomization with `prune:
    true` skip?'
  options:
  - id: a
    text: The cleanup of the objects it applied, which then stay without an owner.
    explanation: Correct. `flux uninstall` avoids the problem because it removes the
      finalizers in the right order.
  - id: b
    text: The check of the Git credential.
    explanation: Not correct. `flux uninstall` avoids the problem because it removes
      the finalizers in the right order.
  - id: c
    text: The renewal of the kubeconfig.
    explanation: Not correct. `flux uninstall` avoids the problem because it removes
      the finalizers in the right order.
  - id: d
    text: The reconcile interval.
    explanation: Not correct. `flux uninstall` avoids the problem because it removes
      the finalizers in the right order.
  correct_option: a
  explanation: Correct. `flux uninstall` avoids the problem because it removes the
    finalizers in the right order.
- id: ats099-040-q14
  type: single_choice
  difficulty: beginner
  learning_objective: Check workloads separately
  source_readings:
  - sections/section-040/module-01/course-04-reading-the-state-of-a-broken-flux.md
  prompt: Flux is failing. What should you check next about the workloads?
  options:
  - id: a
    text: Whether they were deleted when Flux failed.
    explanation: Not correct. If the workloads are healthy, the incident is about
      delivery and not about service.
  - id: b
    text: Whether they have a Flux label.
    explanation: Not correct. If the workloads are healthy, the incident is about
      delivery and not about service.
  - id: c
    text: Nothing; they are down.
    explanation: Not correct. If the workloads are healthy, the incident is about
      delivery and not about service.
  - id: d
    text: Whether they are still running, because Flux failing does not stop them.
    explanation: Correct. If the workloads are healthy, the incident is about delivery
      and not about service.
  correct_option: d
  explanation: Correct. If the workloads are healthy, the incident is about delivery
    and not about service.
- id: ats099-040-q15
  type: single_choice
  difficulty: beginner
  learning_objective: Define RTO
  source_readings:
  - sections/section-040/module-01/course-05-recovery-objectives-and-drills.md
  prompt: What does the recovery time objective measure?
  options:
  - id: a
    text: How much data may be lost.
    explanation: Not correct. The recovery point objective is the one that measures
      data loss in time.
  - id: b
    text: How often a backup runs.
    explanation: Not correct. The recovery point objective is the one that measures
      data loss in time.
  - id: c
    text: How long the service may be without delivery or a cluster before the cost
      is too high.
    explanation: Correct. The recovery point objective is the one that measures data
      loss in time.
  - id: d
    text: How long a Git commit takes to apply.
    explanation: Not correct. The recovery point objective is the one that measures
      data loss in time.
  correct_option: c
  explanation: Correct. The recovery point objective is the one that measures data
    loss in time.
- id: ats099-040-q16
  type: single_choice
  difficulty: intermediate
  learning_objective: Say what Flux affects
  source_readings:
  - sections/section-040/module-01/course-05-recovery-objectives-and-drills.md
  prompt: Which recovery number does Flux affect, and which does it not?
  options:
  - id: a
    text: It affects recovery point only.
    explanation: Not correct. A cluster rebuilt from Git takes the time of bootstrap
      plus the time the workloads need to start.
  - id: b
    text: It affects recovery time; it does not affect recovery point, because it
      holds no data.
    explanation: Correct. A cluster rebuilt from Git takes the time of bootstrap plus
      the time the workloads need to start.
  - id: c
    text: It affects both.
    explanation: Not correct. A cluster rebuilt from Git takes the time of bootstrap
      plus the time the workloads need to start.
  - id: d
    text: It affects neither.
    explanation: Not correct. A cluster rebuilt from Git takes the time of bootstrap
      plus the time the workloads need to start.
  correct_option: b
  explanation: Correct. A cluster rebuilt from Git takes the time of bootstrap plus
    the time the workloads need to start.
- id: ats099-040-q17
  type: single_choice
  difficulty: intermediate
  learning_objective: Place the runbook
  source_readings:
  - sections/section-040/module-01/course-05-recovery-objectives-and-drills.md
  prompt: Where should the runbook for a cluster recovery be stored?
  options:
  - id: a
    text: Outside the cluster it recovers.
    explanation: Correct. A runbook in the cluster is gone when you need it.
  - id: b
    text: In a ConfigMap in `flux-system`.
    explanation: Not correct. A runbook in the cluster is gone when you need it.
  - id: c
    text: In the repository Flux reads, only.
    explanation: Not correct. A runbook in the cluster is gone when you need it.
  - id: d
    text: On the node that runs the control plane.
    explanation: Not correct. A runbook in the cluster is gone when you need it.
  correct_option: a
  explanation: Correct. A runbook in the cluster is gone when you need it.
- id: ats099-040-q18
  type: single_choice
  difficulty: intermediate
  learning_objective: Run a drill
  source_readings:
  - sections/section-040/module-01/course-05-recovery-objectives-and-drills.md
  prompt: What is the point of a timed drill on a throwaway cluster?
  options:
  - id: a
    text: To test the Git host's disk.
    explanation: Not correct. Fix the runbook and anything in Git that caused a surprise.
  - id: b
    text: To measure the size of the repository.
    explanation: Not correct. Fix the runbook and anything in Git that caused a surprise.
  - id: c
    text: To renew all credentials.
    explanation: Not correct. Fix the runbook and anything in Git that caused a surprise.
  - id: d
    text: To compare the real time with the objective and to find missing or wrong
      steps.
    explanation: Correct. Fix the runbook and anything in Git that caused a surprise.
  correct_option: d
  explanation: Correct. Fix the runbook and anything in Git that caused a surprise.
- id: ats099-040-q19
  type: single_choice
  difficulty: beginner
  learning_objective: Sort the backup
  source_readings:
  - sections/section-040/module-02/course-01-what-to-back-up-and-what-to-leave.md
  prompt: Which of these must be backed up because only the cluster holds it?
  options:
  - id: a
    text: A Deployment defined in Git.
    explanation: Not correct. Items in Git or in another system that can produce them
      again need a plan, not a backup.
  - id: b
    text: An image stored in a registry.
    explanation: Not correct. Items in Git or in another system that can produce them
      again need a plan, not a backup.
  - id: c
    text: A Secret created by hand for an application.
    explanation: Correct. Items in Git or in another system that can produce them
      again need a plan, not a backup.
  - id: d
    text: A certificate that an issuer can produce again.
    explanation: Not correct. Items in Git or in another system that can produce them
      again need a plan, not a backup.
  correct_option: c
  explanation: Correct. Items in Git or in another system that can produce them again
    need a plan, not a backup.
- id: ats099-040-q20
  type: single_choice
  difficulty: intermediate
  learning_objective: Find Secrets Git does not describe
  source_readings:
  - sections/section-040/module-02/course-01-what-to-back-up-and-what-to-leave.md
  prompt: How do you list Secrets that Flux did not apply?
  options:
  - id: a
    text: "`flux get secrets -A`"
    explanation: Not correct. Flux labels what it applies. The list also holds Secrets
      made by Kubernetes and by controllers.
  - id: b
    text: "`kubectl get secrets -A -l '!kustomize.toolkit.fluxcd.io/name'`"
    explanation: Correct. Flux labels what it applies. The list also holds Secrets
      made by Kubernetes and by controllers.
  - id: c
    text: "`flux export secret --all`"
    explanation: Not correct. Flux labels what it applies. The list also holds Secrets
      made by Kubernetes and by controllers.
  - id: d
    text: "`kubectl get secrets -A --show-flux`"
    explanation: Not correct. Flux labels what it applies. The list also holds Secrets
      made by Kubernetes and by controllers.
  correct_option: b
  explanation: Correct. Flux labels what it applies. The list also holds Secrets made
    by Kubernetes and by controllers.
- id: ats099-040-q21
  type: single_choice
  difficulty: intermediate
  learning_objective: Know what a Secret backup does not cover
  source_readings:
  - sections/section-040/module-02/course-01-what-to-back-up-and-what-to-leave.md
  prompt: What does a backup of Secrets not cover?
  options:
  - id: a
    text: Data in persistent volumes and databases.
    explanation: Correct. Volumes and databases need their own backup tool.
  - id: b
    text: Credentials for other clusters.
    explanation: Not correct. Volumes and databases need their own backup tool.
  - id: c
    text: The Git credential of Flux.
    explanation: Not correct. Volumes and databases need their own backup tool.
  - id: d
    text: Decryption keys.
    explanation: Not correct. Volumes and databases need their own backup tool.
  correct_option: a
  explanation: Correct. Volumes and databases need their own backup tool.
- id: ats099-040-q22
  type: single_choice
  difficulty: advanced
  learning_objective: Back up the credential for a store
  source_readings:
  - sections/section-040/module-02/course-01-what-to-back-up-and-what-to-leave.md
  prompt: Secrets live in an external store and Git holds references. What must the
    cluster backup hold?
  options:
  - id: a
    text: Every secret value in the store.
    explanation: Not correct. The store has its own backup. Losing the cluster costs
      only the time to restore the credential.
  - id: b
    text: Nothing.
    explanation: Not correct. The store has its own backup. Losing the cluster costs
      only the time to restore the credential.
  - id: c
    text: The store's disk.
    explanation: Not correct. The store has its own backup. Losing the cluster costs
      only the time to restore the credential.
  - id: d
    text: The credential that lets the cluster read the store.
    explanation: Correct. The store has its own backup. Losing the cluster costs only
      the time to restore the credential.
  correct_option: d
  explanation: Correct. The store has its own backup. Losing the cluster costs only
    the time to restore the credential.
- id: ats099-040-q23
  type: single_choice
  difficulty: beginner
  learning_objective: Spot the field that breaks a create
  source_readings:
  - sections/section-040/module-02/course-02-exporting-secrets-and-flux-objects-safely.md
  prompt: Which field in a raw `kubectl get -o yaml` export makes a create fail?
  options:
  - id: a
    text: "`metadata.name`"
    explanation: Not correct. The API server rejects a create that has a `resourceVersion`.
  - id: b
    text: "`metadata.namespace`"
    explanation: Not correct. The API server rejects a create that has a `resourceVersion`.
  - id: c
    text: "`metadata.resourceVersion`"
    explanation: Correct. The API server rejects a create that has a `resourceVersion`.
  - id: d
    text: "`type`"
    explanation: Not correct. The API server rejects a create that has a `resourceVersion`.
  correct_option: c
  explanation: Correct. The API server rejects a create that has a `resourceVersion`.
- id: ats099-040-q24
  type: single_choice
  difficulty: intermediate
  learning_objective: Select Secrets by label
  source_readings:
  - sections/section-040/module-02/course-02-exporting-secrets-and-flux-objects-safely.md
  prompt: Why export Secrets by a label such as `dr-backup=critical`?
  options:
  - id: a
    text: The label encrypts them.
    explanation: Not correct. The label says what is in the backup and needs no list
      of names.
  - id: b
    text: A new Secret with the label is included without a change to the script.
    explanation: Correct. The label says what is in the backup and needs no list of
      names.
  - id: c
    text: Flux needs the label to apply them.
    explanation: Not correct. The label says what is in the backup and needs no list
      of names.
  - id: d
    text: The label stops them being pruned.
    explanation: Not correct. The label says what is in the backup and needs no list
      of names.
  correct_option: b
  explanation: Correct. The label says what is in the backup and needs no list of
    names.
- id: ats099-040-q25
  type: single_choice
  difficulty: intermediate
  learning_objective: Compare the live state with Git
  source_readings:
  - sections/section-040/module-02/course-02-exporting-secrets-and-flux-objects-safely.md
  prompt: What does a difference between `flux export` and Git show?
  options:
  - id: a
    text: A change that exists only in the cluster and would be lost in a rebuild.
    explanation: Correct. Commit the change or remove it.
  - id: b
    text: A bug in the CLI.
    explanation: Not correct. Commit the change or remove it.
  - id: c
    text: A Git outage.
    explanation: Not correct. Commit the change or remove it.
  - id: d
    text: A stale source cache.
    explanation: Not correct. Commit the change or remove it.
  correct_option: a
  explanation: Correct. Commit the change or remove it.
- id: ats099-040-q26
  type: single_choice
  difficulty: intermediate
  learning_objective: Protect the export
  source_readings:
  - sections/section-040/module-02/course-02-exporting-secrets-and-flux-objects-safely.md
  prompt: Where should a file of exported Secrets be stored?
  options:
  - id: a
    text: In `gitops/fleet` next to the Kustomizations.
