# Recover A Cluster From Git (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-099-playground-040-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install the Flux CLI, start Gitea and the webhook receiver, seed the repositories and bootstrap Flux. Flux bootstrapped from gitops/fleet with podinfo."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Gitea (Service gitea-http on port 3000), the tester client and the webhook receiver."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
