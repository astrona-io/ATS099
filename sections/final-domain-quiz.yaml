  explanation: Correct. A TokenReview returns `authenticated` for the token; an invalid
    token comes back as not authenticated.
- id: ats099-final-q29
  type: single_choice
  difficulty: intermediate
  learning_objective: Say what deleting a pruning Kustomization does
  source_readings:
  - sections/section-030/module-02/course-04-remote-health-checks-and-pruning.md
  prompt: 'What happens to the remote objects when a Kustomization with `prune: true`
    is deleted and `deletionPolicy` is not set?'
  options:
  - id: a
    text: They stay, as the Kustomization is only an object.
    explanation: Not correct. The default `MirrorPrune` deletes when `prune` is true.
      `Orphan` keeps the objects.
  - id: b
    text: They are removed from the remote cluster, using the kubeconfig.
    explanation: Correct. The default `MirrorPrune` deletes when `prune` is true.
      `Orphan` keeps the objects.
  - id: c
    text: They move to the management cluster.
    explanation: Not correct. The default `MirrorPrune` deletes when `prune` is true.
      `Orphan` keeps the objects.
  - id: d
    text: They are suspended.
    explanation: Not correct. The default `MirrorPrune` deletes when `prune` is true.
      `Orphan` keeps the objects.
  correct_option: b
  explanation: Correct. The default `MirrorPrune` deletes when `prune` is true. `Orphan`
    keeps the objects.
- id: ats099-final-q30
  type: single_choice
  difficulty: intermediate
  learning_objective: Escape a literal dollar sign
  source_readings:
  - sections/section-030/module-03/course-02-environments-as-folders-and-overlays.md
  prompt: How do you keep the text `${HOME}` in a manifest when `postBuild` substitution
    is on?
  options:
  - id: a
    text: Write it as `\\${HOME}`.
    explanation: Not correct. Substitution replaces every `${...}`, and a doubled
      dollar sign marks a literal one.
  - id: b
    text: Write it as `$${HOME}`.
    explanation: Correct. Substitution replaces every `${...}`, and a doubled dollar
      sign marks a literal one.
  - id: c
    text: Wrap it in single quotes.
    explanation: Not correct. Substitution replaces every `${...}`, and a doubled
      dollar sign marks a literal one.
  - id: d
    text: It is never replaced.
    explanation: Not correct. Substitution replaces every `${...}`, and a doubled
      dollar sign marks a literal one.
  correct_option: b
  explanation: Correct. Substitution replaces every `${...}`, and a doubled dollar
    sign marks a literal one.
- id: ats099-final-q31
  type: single_choice
  difficulty: intermediate
  learning_objective: Judge flux export as a backup
  source_readings:
  - sections/section-040/module-01/course-01-what-git-does-not-hold.md
  prompt: Is flux export a backup of the cluster?
  options:
  - id: a
    text: No. It exports Flux objects that are already in Git, never Secret values
      or data.
    explanation: Correct. Credentials and data need their own home.
  - id: b
    text: Yes. It exports Secrets and volumes.
    explanation: Not correct. It prints no Secret values.
  - id: c
    text: Yes, but only for Helm releases.
    explanation: Not correct. It covers Flux objects, not just Helm.
  - id: d
    text: No. It deletes the objects it exports.
    explanation: Not correct. It only prints YAML.
  correct_option: a
  explanation: Correct. Credentials and data need their own home.
