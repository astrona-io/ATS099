# Final domain knowledge check across all sections.
schema_version: 1
kind: question_bank
id: ats099-final
course_id: ATS099
exam_code: FLUX
status: alpha
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: domain
  id: multi-tenancy-enterprise-operations
  title: Multi-Tenancy, Enterprise Operations & Cluster Management
questions:
- id: ats099-final-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Say where tenant objects live
  source_readings:
  - sections/section-010/module-01/course-01-platform-and-tenant-repositories.md
  prompt: Which repository holds the Namespace, ServiceAccount and RoleBinding of
    a tenant?
  options:
  - id: a
    text: The platform repository.
    explanation: Correct. Whoever controls the RoleBinding controls the rights, so
      the platform owns it.
  - id: b
    text: The tenant's own repository.
    explanation: Not correct. A tenant that controls its own RoleBinding controls
      its own rights.
  - id: c
    text: Both repositories, with a copy in each.
    explanation: Not correct. One copy in the platform repository is enough and is
      the one that counts.
  - id: d
    text: None. Flux creates them without Git.
    explanation: Not correct. Flux only applies what its sources hold.
  correct_option: a
  explanation: Correct. Whoever controls the RoleBinding controls the rights, so the
    platform owns it.
- id: ats099-final-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Describe impersonation
  source_readings:
  - sections/section-010/module-01/course-02-impersonation-with-service-accounts.md
  prompt: What happens when a Flux Kustomization sets spec.serviceAccountName?
  options:
  - id: a
    text: Flux copies the ServiceAccount token into the tenant's repository.
    explanation: Not correct. Flux never writes tokens to Git.
  - id: b
    text: kustomize-controller sends every object to the API server as that ServiceAccount,
      so RBAC checks the account's permissions.
    explanation: Correct. The API server judges the request by the named account.
  - id: c
    text: The API server checks the controller's permissions and only logs the account
      name.
    explanation: Not correct. The check uses the account, not the controller.
  - id: d
    text: Flux starts a separate pod under that ServiceAccount for each file.
    explanation: Not correct. kustomize-controller itself sends the requests.
  correct_option: b
  explanation: Correct. The API server judges the request by the named account.
- id: ats099-final-q03
  type: single_choice
  difficulty: advanced
  learning_objective: Explain the effect on platform objects
  source_readings:
  - sections/section-010/module-01/course-03-locking-down-the-cluster.md
  prompt: The flag --default-service-account=default is on, and a platform Kustomization
    in flux-system has no serviceAccountName. What happens?
  options:
  - id: a
    text: It keeps running as cluster-admin.
    explanation: Not correct. The flag applies to every object without a name.
  - id: b
    text: Flux skips the flag for objects in flux-system.
    explanation: Not correct. There is no such exception.
  - id: c
    text: It runs as flux-system/default, which has no rights, and fails.
    explanation: Correct. Platform Kustomizations must name kustomize-controller.
  - id: d
    text: Flux deletes the Kustomization.
    explanation: Not correct. It stays and reports an error.
  correct_option: c
  explanation: Correct. Platform Kustomizations must name kustomize-controller.
- id: ats099-final-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Tell Provider from Alert
  source_readings:
  - sections/section-020/module-01/course-01-events-providers-and-alerts.md
  prompt: Which object says where Flux events are sent?
  options:
  - id: a
    text: An Alert.
    explanation: Not correct. An Alert says which events to send.
  - id: b
    text: A GitRepository.
    explanation: Not correct. It fetches a repository.
  - id: c
    text: A Kustomization.
    explanation: Not correct. It applies files.
  - id: d
    text: A Provider.
    explanation: Correct. A Provider holds the type and the address.
  correct_option: d
  explanation: Correct. A Provider holds the type and the address.
- id: ats099-final-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Know the filter precedence
  source_readings:
  - sections/section-020/module-01/course-02-filtering-alerts.md
  prompt: An event message matches a pattern in inclusionList and a pattern in exclusionList.
    What happens?
  options:
  - id: a
    text: The event is sent, because inclusionList wins.
    explanation: Not correct. The order is the other way round.
  - id: b
    text: The event is sent twice.
    explanation: Not correct. An Alert sends an event once.
  - id: c
    text: The event is dropped, because exclusionList wins.
    explanation: Correct. A match in exclusionList always drops the event.
  - id: d
    text: The Alert reports an error.
    explanation: Not correct. No error is raised.
  correct_option: c
  explanation: Correct. A match in exclusionList always drops the event.
- id: ats099-final-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Locate gotk_resource_info
  source_readings:
  - sections/section-020/module-01/course-03-metrics-and-flux-stats.md
  prompt: The metric gotk_resource_info is missing in Prometheus. Where do you look
    first?
  options:
  - id: a
    text: At the Flux controllers' metrics port.
    explanation: Not correct. They do not export it.
  - id: b
    text: At the notification-controller Alert.
    explanation: Not correct. Alerts do not create metrics.
  - id: c
    text: At the GitRepository interval.
    explanation: Not correct. The interval does not affect it.
  - id: d
    text: At kube-state-metrics and its custom resource state configuration.
    explanation: Correct. The Flux controllers do not export this metric.
  correct_option: d
  explanation: Correct. The Flux controllers do not export this metric.
- id: ats099-final-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Describe sourceRef.namespace
  source_readings:
  - sections/section-030/module-01/course-01-cross-namespace-references.md
  prompt: What does sourceRef.namespace do on a Flux Kustomization?
  options:
  - id: a
    text: It makes Flux look for the source in that namespace instead of the Kustomization's
      own.
    explanation: Correct. Without it, Flux uses the object's own namespace.
  - id: b
    text: It creates the source in that namespace.
    explanation: Not correct. It only points at an existing source.
  - id: c
    text: It sets the namespace the objects are applied to.
    explanation: Not correct. targetNamespace does that.
  - id: d
    text: It copies the source to every namespace.
    explanation: Not correct. Nothing is copied.
  correct_option: a
  explanation: Correct. Without it, Flux uses the object's own namespace.
- id: ats099-final-q08
  type: single_choice
  difficulty: beginner
  learning_objective: Name the remote cluster field
  source_readings:
  - sections/section-030/module-01/course-02-applying-to-a-remote-cluster.md
  prompt: Which field makes a Flux Kustomization apply to another cluster?
  options:
  - id: a
    text: spec.serviceAccountName
    explanation: Not correct. It selects the account to impersonate in the same cluster.
  - id: b
    text: spec.kubeConfig.secretRef
    explanation: Correct. It names the Secret that holds the kubeconfig.
  - id: c
    text: spec.targetNamespace
    explanation: Not correct. It sets a namespace.
  - id: d
    text: spec.sourceRef
    explanation: Not correct. It selects the source.
  correct_option: b
  explanation: Correct. It names the Secret that holds the kubeconfig.
- id: ats099-final-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Name the Cluster API Secret
  source_readings:
  - sections/section-030/module-01/course-03-cluster-api-and-fleets.md
  prompt: Cluster API creates a cluster named staging in the namespace clusters. Which
    Secret does it write for Flux?
  options:
  - id: a
    text: staging-token in flux-system.
    explanation: Not correct. Cluster API writes into the Cluster's namespace.
  - id: b
    text: staging-kubeconfig in the namespace clusters, with the kubeconfig under
      the key value.
    explanation: Correct. Put the Flux Kustomization in the same namespace.
  - id: c
    text: kubeconfig-staging in kube-system.
    explanation: Not correct. The name is <cluster>-kubeconfig.
  - id: d
    text: No Secret. Flux reads the Cluster object directly.
    explanation: Not correct. Flux needs the Secret.
  correct_option: b
  explanation: Correct. Put the Flux Kustomization in the same namespace.
- id: ats099-final-q10
  type: single_choice
  difficulty: beginner
  learning_objective: Name what Git does not hold
  source_readings:
  - sections/section-040/module-01/course-01-what-git-does-not-hold.md
  prompt: Which item is not in Git and must be restored before Flux needs it?
  options:
  - id: a
    text: The private key that decrypts SOPS-encrypted files.
    explanation: Correct. Flux can only apply what it can read and decrypt.
  - id: b
    text: gotk-components.yaml.
    explanation: Not correct. It is in Git.
  - id: c
    text: A Flux Kustomization under clusters/kind.
    explanation: Not correct. Flux objects are in Git.
  - id: d
    text: gotk-sync.yaml.
    explanation: Not correct. It is in Git.
  correct_option: a
  explanation: Correct. Flux can only apply what it can read and decrypt.
- id: ats099-final-q11
  type: single_choice
  difficulty: advanced
  learning_objective: Explain a suspend that survives resume
  source_readings:
  - sections/section-040/module-01/course-02-suspend-uninstall-and-reinstall.md
  prompt: 'suspend: true is committed in Git. Why does flux resume not end it for
    long?'
  options:
  - id: a
    text: flux resume only works on HelmReleases.
    explanation: Not correct. It works on Kustomizations too.
  - id: b
    text: Kubernetes blocks resume for 24 hours.
    explanation: Not correct. There is no such delay.
  - id: c
    text: The Git credential has expired.
    explanation: Not correct. The cause is the file in Git.
  - id: d
    text: 'The next reconcile of flux-system applies suspend: true again.'
    explanation: Correct. Remove the line in Git.
  correct_option: d
  explanation: Correct. Remove the line in Git.
- id: ats099-final-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: Order a rebuild
  source_readings:
  - sections/section-040/module-01/course-03-rebuilding-a-lost-cluster.md
  prompt: What comes right before flux bootstrap on a new cluster?
  options:
  - id: a
    text: Restoring data from backups.
    explanation: Not correct. Data comes after the applications.
  - id: b
    text: Verifying that every object is Ready.
    explanation: Not correct. Verification is last.
  - id: c
    text: Restoring the keys and credentials Flux needs.
    explanation: Correct. Flux retries forever, but objects behind a missing credential
      wait.
  - id: d
    text: Deleting the Git repository history.
    explanation: Not correct. Git is the source and stays.
  correct_option: c
  explanation: Correct. Flux retries forever, but objects behind a missing credential
    wait.
- id: ats099-final-q13
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the scope of a RoleBinding
  source_readings:
  - sections/section-010/module-01/course-01-platform-and-tenant-repositories.md
  prompt: A RoleBinding in the namespace team-a binds the ClusterRole cluster-admin
    to the ServiceAccount team-a. What rights does the account get?
  options:
  - id: a
    text: Every right in the whole cluster.
    explanation: Not correct. That needs a ClusterRoleBinding.
  - id: b
    text: Every right inside the namespace team-a and none outside it.
    explanation: Correct. A RoleBinding limits the rules of a ClusterRole to its own
      namespace.
  - id: c
    text: Read-only rights inside team-a.
    explanation: Not correct. cluster-admin is not read-only.
  - id: d
    text: No rights, because a RoleBinding cannot name cluster-admin.
    explanation: Not correct. A RoleBinding may reference a ClusterRole.
  correct_option: b
  explanation: Correct. A RoleBinding limits the rules of a ClusterRole to its own
    namespace.
- id: ats099-final-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: Name the default ServiceAccount flag
  source_readings:
  - sections/section-010/module-01/course-03-locking-down-the-cluster.md
  prompt: A tenant writes a Kustomization with no serviceAccountName. Which flag makes
    it run with no rights instead of cluster-admin?
  options:
  - id: a
    text: "--default-service-account=default"
    explanation: Correct. The object impersonates the empty default account in its
      namespace.
  - id: b
    text: "--no-remote-bases=true"
    explanation: Not correct. It stops Kustomize from pulling remote bases.
  - id: c
    text: "--no-cross-namespace-refs=true"
    explanation: Not correct. It limits references to the object's own namespace.
  - id: d
    text: "--log-level=error"
    explanation: Not correct. It only changes the log output.
  correct_option: a
  explanation: Correct. The object impersonates the empty default account in its namespace.
- id: ats099-final-q15
  type: single_choice
  difficulty: intermediate
  learning_objective: Say why the admin ClusterRole protects a quota
  source_readings:
  - sections/section-010/module-02/course-01-choosing-the-tenant-role.md
  prompt: Why is the ClusterRole `admin` a better tenant role than `cluster-admin`
    when the platform sets a ResourceQuota?
  options:
  - id: a
    text: "`admin` hides the ResourceQuota from the tenant."
    explanation: Not correct. The built-in `admin` role has only get, list and watch
      on resource quotas, while `cluster-admin` allows every verb.
  - id: b
    text: "`admin` blocks Deployments above the quota."
    explanation: Not correct. The built-in `admin` role has only get, list and watch
      on resource quotas, while `cluster-admin` allows every verb.
  - id: c
    text: "`admin` cannot be bound with a RoleBinding."
    explanation: Not correct. The built-in `admin` role has only get, list and watch
      on resource quotas, while `cluster-admin` allows every verb.
  - id: d
    text: "`admin` allows only reading a ResourceQuota, so the tenant cannot change
      or delete it."
    explanation: Correct. The built-in `admin` role has only get, list and watch on
      resource quotas, while `cluster-admin` allows every verb.
  correct_option: d
  explanation: Correct. The built-in `admin` role has only get, list and watch on
    resource quotas, while `cluster-admin` allows every verb.
- id: ats099-final-q16
  type: single_choice
  difficulty: intermediate
  learning_objective: Place a SOPS decryption Secret
  source_readings:
  - sections/section-010/module-02/course-03-network-isolation-and-tenant-secrets.md
  prompt: Where must the Secret named in `spec.decryption.secretRef` of a tenant Flux
    `Kustomization` be?
  options:
  - id: a
    text: In `flux-system`.
    explanation: Not correct. The Flux object looks the Secret up in its own namespace,
      which also keeps one tenant from using another tenant's key.
  - id: b
    text: In the `default` namespace.
    explanation: Not correct. The Flux object looks the Secret up in its own namespace,
      which also keeps one tenant from using another tenant's key.
  - id: c
    text: In the same namespace as the Flux `Kustomization`.
    explanation: Correct. The Flux object looks the Secret up in its own namespace,
      which also keeps one tenant from using another tenant's key.
  - id: d
    text: In the tenant's Git repository.
    explanation: Not correct. The Flux object looks the Secret up in its own namespace,
      which also keeps one tenant from using another tenant's key.
  correct_option: c
  explanation: Correct. The Flux object looks the Secret up in its own namespace,
    which also keeps one tenant from using another tenant's key.
- id: ats099-final-q17
  type: single_choice
  difficulty: intermediate
  learning_objective: Use dependsOn to order Kustomizations
  source_readings:
  - sections/section-010/module-03/course-01-repository-layouts.md
  prompt: A `tenants` Kustomization must wait for `infrastructure`. Which field does
    that?
  options:
  - id: a
    text: "`spec.wait: infrastructure`"
    explanation: Not correct. `spec.dependsOn` makes a Kustomization wait until the
      listed Kustomizations are Ready.
  - id: b
    text: "`spec.dependsOn` with the name `infrastructure`."
    explanation: Correct. `spec.dependsOn` makes a Kustomization wait until the listed
      Kustomizations are Ready.
  - id: c
    text: "`spec.sourceRef.name: infrastructure`"
    explanation: Not correct. `spec.dependsOn` makes a Kustomization wait until the
      listed Kustomizations are Ready.
  - id: d
    text: "`spec.targetNamespace: infrastructure`"
    explanation: Not correct. `spec.dependsOn` makes a Kustomization wait until the
      listed Kustomizations are Ready.
  correct_option: b
  explanation: Correct. `spec.dependsOn` makes a Kustomization wait until the listed
    Kustomizations are Ready.
- id: ats099-final-q18
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the role of the binding
  source_readings:
  - sections/section-010/module-03/course-03-admission-policy-for-flux-objects.md
  prompt: What does a ValidatingAdmissionPolicyBinding do?
  options:
  - id: a
    text: It connects a policy to the namespaces it applies to and sets the action,
      such as `Deny`.
    explanation: Correct. The policy defines what to check. The binding says where
      it applies and what to do on a failure.
  - id: b
    text: It defines the CEL expression.
    explanation: Not correct. The policy defines what to check. The binding says where
      it applies and what to do on a failure.
  - id: c
    text: It lists the Flux objects that may bypass the policy.
    explanation: Not correct. The policy defines what to check. The binding says where
      it applies and what to do on a failure.
  - id: d
    text: It installs the admission webhook.
    explanation: Not correct. The policy defines what to check. The binding says where
      it applies and what to do on a failure.
  correct_option: a
  explanation: Correct. The policy defines what to check. The binding says where it
    applies and what to do on a failure.
- id: ats099-final-q19
  type: single_choice
  difficulty: intermediate
  learning_objective: Store chat webhook addresses safely
  source_readings:
  - sections/section-020/module-01/course-01-events-providers-and-alerts.md
  prompt: Where do you keep the address of a Microsoft Teams webhook?
  options:
  - id: a
    text: In spec.address of the Provider in Git.
    explanation: Not correct. That puts the secret in Git.
  - id: b
    text: In the eventMetadata of the Alert.
    explanation: Not correct. eventMetadata is sent with every event.
  - id: c
    text: In a Secret with the key address, named in spec.secretRef.
    explanation: Correct. Whoever holds the address can post to the channel.
  - id: d
    text: In a ConfigMap in flux-system.
    explanation: Not correct. A ConfigMap is not a secret store.
  correct_option: c
  explanation: Correct. Whoever holds the address can post to the channel.
- id: ats099-final-q20
  type: single_choice
  difficulty: intermediate
  learning_objective: Read a histogram
  source_readings:
  - sections/section-020/module-01/course-03-metrics-and-flux-stats.md
  prompt: What kind of metric is gotk_reconcile_duration_seconds?
  options:
  - id: a
    text: A gauge that goes up and down.
    explanation: Not correct. It sorts measurements into buckets.
  - id: b
    text: A histogram, with the series _bucket, _count and _sum.
    explanation: Correct. It records how long reconciliations take per object.
  - id: c
    text: A counter with a single series.
    explanation: Not correct. It has three series.
  - id: d
    text: A log line per reconcile.
    explanation: Not correct. It is a metric, not a log.
  correct_option: b
  explanation: Correct. It records how long reconciliations take per object.
- id: ats099-final-q21
  type: single_choice
  difficulty: intermediate
  learning_objective: Keep the interval with a Receiver
  source_readings:
  - sections/section-020/module-02/course-01-what-a-receiver-is.md
  prompt: Why keep an `interval` on a source that has a Receiver?
  options:
  - id: a
    text: The Receiver cannot work without an interval.
    explanation: Not correct. A webhook is sent once. A long interval such as `1h`
      costs few requests and still catches a missed call.
  - id: b
    text: A webhook can be lost, and the interval is the fallback.
    explanation: Correct. A webhook is sent once. A long interval such as `1h` costs
      few requests and still catches a missed call.
  - id: c
    text: The interval sets how fast the Receiver responds.
    explanation: Not correct. A webhook is sent once. A long interval such as `1h`
      costs few requests and still catches a missed call.
  - id: d
    text: The interval signs the webhook.
    explanation: Not correct. A webhook is sent once. A long interval such as `1h`
      costs few requests and still catches a missed call.
  correct_option: b
  explanation: Correct. A webhook is sent once. A long interval such as `1h` costs
    few requests and still catches a missed call.
- id: ats099-final-q22
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose a type that checks a signature
  source_readings:
  - sections/section-020/module-02/course-03-receivers-for-git-hosts-and-registries.md
  prompt: Which Receiver type verifies an HMAC signature computed over the request
    body?
  options:
  - id: a
    text: "`generic`"
    explanation: Not correct. `generic-hmac` checks the `X-Signature` header. `generic`
      relies on the secret path alone.
  - id: b
    text: "`github` with no events"
    explanation: Not correct. `generic-hmac` checks the `X-Signature` header. `generic`
      relies on the secret path alone.
  - id: c
    text: "`dockerhub`"
    explanation: Not correct. `generic-hmac` checks the `X-Signature` header. `generic`
      relies on the secret path alone.
  - id: d
    text: "`generic-hmac`"
    explanation: Correct. `generic-hmac` checks the `X-Signature` header. `generic`
      relies on the secret path alone.
  correct_option: d
  explanation: Correct. `generic-hmac` checks the `X-Signature` header. `generic`
    relies on the secret path alone.
- id: ats099-final-q23
  type: single_choice
  difficulty: beginner
  learning_objective: Name the condition that means the last reconcile worked
  source_readings:
  - sections/section-020/module-03/course-01-reading-status-conditions.md
  prompt: Which condition type says the last reconcile of the current spec finished
    with success?
  options:
  - id: a
    text: "`Stalled`"
    explanation: Not correct. `Ready` `True` is the main success condition of a Flux
      object.
  - id: b
    text: "`Ready`"
    explanation: Correct. `Ready` `True` is the main success condition of a Flux object.
  - id: c
    text: "`Reconciling`"
    explanation: Not correct. `Ready` `True` is the main success condition of a Flux
      object.
  - id: d
    text: "`Fetched`"
    explanation: Not correct. `Ready` `True` is the main success condition of a Flux
      object.
  correct_option: b
  explanation: Correct. `Ready` `True` is the main success condition of a Flux object.
- id: ats099-final-q24
  type: single_choice
  difficulty: intermediate
  learning_objective: Say what timeout does
  source_readings:
  - sections/section-020/module-03/course-02-health-checks-and-timeouts.md
  prompt: 'A rollout takes 4 minutes and the Kustomization has `timeout: 2m` with
    a health check. What happens?'
  options:
  - id: a
    text: Flux waits 4 minutes and succeeds.
    explanation: Not correct. After the timeout, an object that is not ready counts
      as a failure.
  - id: b
    text: Flux deletes the Deployment.
    explanation: Not correct. After the timeout, an object that is not ready counts
      as a failure.
  - id: c
    text: Flux ignores the health check.
    explanation: Not correct. After the timeout, an object that is not ready counts
      as a failure.
  - id: d
    text: The reconcile fails with `HealthCheckFailed`, although the application starts.
    explanation: Correct. After the timeout, an object that is not ready counts as
      a failure.
  correct_option: d
  explanation: Correct. After the timeout, an object that is not ready counts as a
    failure.
- id: ats099-final-q25
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the cross-namespace risk
  source_readings:
  - sections/section-030/module-01/course-01-cross-namespace-references.md
  prompt: Why does a shared platform forbid cross-namespace references?
  options:
  - id: a
    text: They make source-controller crash.
    explanation: Not correct. The risk is access, not stability.
  - id: b
    text: They are not supported by Flux.
    explanation: Not correct. They work by default.
  - id: c
    text: They double the storage of every artifact.
    explanation: Not correct. They save a fetch.
  - id: d
    text: A team could point at the platform's GitRepository and apply folders that
      are not theirs.
    explanation: Correct. That source holds the whole platform repository.
  correct_option: d
  explanation: Correct. That source holds the whole platform repository.
- id: ats099-final-q26
  type: single_choice
  difficulty: intermediate
  learning_objective: Test the address from the right place
  source_readings:
  - sections/section-030/module-01/course-04-reading-a-failing-remote-apply.md
  prompt: A kubeconfig uses `https://kubernetes.default.svc`. Why does a check from
    your laptop fail although the Kustomization works?
  options:
  - id: a
    text: The token is valid only for the controller.
    explanation: Not correct. The address must work from the pod of kustomize-controller,
      not from your machine.
  - id: b
    text: That address only resolves inside the cluster, so the check must run from
      a pod in it.
    explanation: Correct. The address must work from the pod of kustomize-controller,
      not from your machine.
  - id: c
    text: kubectl cannot read a kubeconfig from a Secret.
    explanation: Not correct. The address must work from the pod of kustomize-controller,
      not from your machine.
  - id: d
    text: The certificate is valid only for `localhost`.
    explanation: Not correct. The address must work from the pod of kustomize-controller,
      not from your machine.
  correct_option: b
  explanation: Correct. The address must work from the pod of kustomize-controller,
    not from your machine.
