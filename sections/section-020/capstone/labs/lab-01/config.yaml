# Find Why No Alert Arrives
# Astrona graded capstone. Schema: internal/config.LabConfig.

metadata:
  name: "ats-099-capstone-020"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, starts Gitea, seeds the repositories and bootstraps Flux from gitops/fleet"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-099-capstone-020-setup"
      description: "Commits a Provider and an Alert with three faults"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Gitea, the tester pod and the webhook receiver"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits for Gitea and the Flux controllers that exist"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-alert-spec"
      description: "Passes when Provider webhook posts to the receiver and Alert flux-errors forwards only errors, from podinfo and the flux-system source, with no catch-all exclusion"
      type: "file"
      source: "validation/validate-alert-spec.sh"
    - name: "validate-alerting-in-git"
      description: "Passes when a Provider and an Alert are committed under clusters/kind in gitops/fleet"
      type: "file"
      source: "validation/validate-alerting-in-git.sh"
    - name: "validate-kustomization-failure-delivered"
      description: "Passes when a podinfo Kustomization failure reaches the webhook receiver as an error event"
      type: "file"
      source: "validation/validate-kustomization-failure-delivered.sh"
    - name: "validate-source-failure-delivered"
      description: "Passes when a GitRepository flux-system failure reaches the webhook receiver as an error event"
      type: "file"
      source: "validation/validate-source-failure-delivered.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - mendhak/http-https-echo:42
      - nicolaka/netshoot:v0.13
