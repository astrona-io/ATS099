  - id: c
    text: kustomize-controller
    explanation: Not correct. The Flux controllers export `gotk_reconcile_duration_seconds`
      and controller-runtime metrics. The resource info metric comes from kube-state-metrics.
  - id: d
    text: notification-controller
    explanation: Not correct. The Flux controllers export `gotk_reconcile_duration_seconds`
      and controller-runtime metrics. The resource info metric comes from kube-state-metrics.
  correct_option: b
  explanation: Correct. The Flux controllers export `gotk_reconcile_duration_seconds`
    and controller-runtime metrics. The resource info metric comes from kube-state-metrics.
