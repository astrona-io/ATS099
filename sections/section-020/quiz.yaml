questions:
- id: ats099-020-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Tell Provider from Alert
  source_readings:
  - sections/section-020/module-01/course-01-events-providers-and-alerts.md
  prompt: Which object says where Flux events are sent?
  options:
  - id: a
    text: An Alert.
    explanation: Not correct. An Alert says which events to send.
  - id: b
    text: A Provider.
    explanation: Correct. A Provider holds the type and the address.
  - id: c
    text: A GitRepository.
    explanation: Not correct. It fetches a repository.
  - id: d
    text: A Kustomization.
    explanation: Not correct. It applies files.
  correct_option: b
  explanation: Correct. A Provider holds the type and the address.
- id: ats099-020-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Store chat webhook addresses safely
  source_readings:
  - sections/section-020/module-01/course-01-events-providers-and-alerts.md
  prompt: Where do you keep the address of a Microsoft Teams webhook?
  options:
  - id: a
    text: In spec.address of the Provider in Git.
    explanation: Not correct. That puts the secret in Git.
  - id: b
    text: In the eventMetadata of the Alert.
    explanation: Not correct. eventMetadata is sent with every event.
  - id: c
    text: In a Secret with the key address, named in spec.secretRef.
    explanation: Correct. Whoever holds the address can post to the channel.
  - id: d
    text: In a ConfigMap in flux-system.
    explanation: Not correct. A ConfigMap is not a secret store.
  correct_option: c
  explanation: Correct. Whoever holds the address can post to the channel.
- id: ats099-020-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Describe a generic Provider
  source_readings:
  - sections/section-020/module-01/course-01-events-providers-and-alerts.md
  prompt: How does a generic Provider deliver an event?
  options:
  - id: a
    text: As an HTTP GET with the event in the query string.
    explanation: Not correct. The body is sent with POST.
  - id: b
    text: By writing a file on the node.
    explanation: Not correct. Nothing is written to the node.
  - id: c
    text: By creating a Secret in the receiver's namespace.
    explanation: Not correct. It sends a request.
  - id: d
    text: As an HTTP POST with a JSON body to the address.
    explanation: Correct. The receiver reads the JSON.
  correct_option: d
  explanation: Correct. The receiver reads the JSON.
- id: ats099-020-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Know the severity default
  source_readings:
  - sections/section-020/module-01/course-02-filtering-alerts.md
  prompt: An Alert has no eventSeverity. Which events does it forward?
  options:
  - id: a
    text: Events of every severity, because the default is info.
    explanation: Correct. Leaving it out forwards every success too.
  - id: b
    text: Only errors.
    explanation: 'Not correct. Errors only needs eventSeverity: error.'
  - id: c
    text: No events until a severity is set.
    explanation: Not correct. The default applies.
  - id: d
    text: Only events with reason ReconciliationFailed.
    explanation: Not correct. Reasons are not filtered by default.
  correct_option: a
  explanation: Correct. Leaving it out forwards every success too.
- id: ats099-020-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Know the filter precedence
  source_readings:
  - sections/section-020/module-01/course-02-filtering-alerts.md
  prompt: An event message matches a pattern in inclusionList and a pattern in exclusionList.
    What happens?
  options:
  - id: a
    text: The event is sent, because inclusionList wins.
    explanation: Not correct. The order is the other way round.
  - id: b
    text: The event is sent twice.
    explanation: Not correct. An Alert sends an event once.
  - id: c
    text: The event is dropped, because exclusionList wins.
    explanation: Correct. A match in exclusionList always drops the event.
  - id: d
    text: The Alert reports an error.
    explanation: Not correct. No error is raised.
  correct_option: c
  explanation: Correct. A match in exclusionList always drops the event.
- id: ats099-020-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Know the eventSources namespace default
  source_readings:
  - sections/section-020/module-01/course-02-filtering-alerts.md
  prompt: An eventSources entry has no namespace. Which namespace does it mean?
  options:
  - id: a
    text: flux-system, always.
    explanation: Not correct. It is the Alert's own namespace.
  - id: b
    text: Every namespace.
    explanation: Not correct. Use separate entries for other namespaces.
  - id: c
    text: The default namespace.
    explanation: Not correct. default has no special role here.
  - id: d
    text: The namespace of the Alert.
    explanation: Correct. Under the lockdown, other namespaces are refused anyway.
  correct_option: d
  explanation: Correct. Under the lockdown, other namespaces are refused anyway.
- id: ats099-020-q07
  type: single_choice
  difficulty: advanced
  learning_objective: Explain a recovery that sends nothing
  source_readings:
  - sections/section-020/module-01/course-02-filtering-alerts.md
  prompt: 'An Alert with eventSeverity: error is in place. podinfo is repaired and
    the receiver gets nothing new. Why?'
  options:
  - id: a
    text: The recovery produces info events, and the severity filter drops them.
    explanation: Correct. Only error events pass.
  - id: b
    text: The receiver ignores recoveries.
    explanation: Not correct. The receiver never saw them.
  - id: c
    text: The Alert suspends itself after the first message.
    explanation: Not correct. An Alert has no such behaviour.
  - id: d
    text: Flux sends recovery events only after 24 hours.
    explanation: Not correct. They are not delayed.
  correct_option: a
  explanation: Correct. Only error events pass.
- id: ats099-020-q08
  type: single_choice
  difficulty: beginner
  learning_objective: Find the metrics endpoint
  source_readings:
  - sections/section-020/module-01/course-03-metrics-and-flux-stats.md
  prompt: On which port and path do the Flux controllers serve Prometheus metrics?
  options:
  - id: a
    text: Port 9440, path /healthz.
    explanation: Not correct. That is a health endpoint, not metrics.
  - id: b
    text: Port 8080, path /metrics.
    explanation: Correct. The container port is named http-prom.
  - id: c
    text: Port 443, path /metrics.
    explanation: Not correct. The controllers serve metrics on 8080.
  - id: d
    text: Port 8080, path /events.
    explanation: Not correct. The path is /metrics.
  correct_option: b
  explanation: Correct. The container port is named http-prom.
- id: ats099-020-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Locate gotk_resource_info
  source_readings:
  - sections/section-020/module-01/course-03-metrics-and-flux-stats.md
  prompt: The metric gotk_resource_info is missing in Prometheus. Where do you look
    first?
  options:
  - id: a
    text: At kube-state-metrics and its custom resource state configuration.
    explanation: Correct. The Flux controllers do not export this metric.
  - id: b
    text: At the Flux controllers' metrics port.
    explanation: Not correct. They do not export it.
  - id: c
    text: At the notification-controller Alert.
    explanation: Not correct. Alerts do not create metrics.
  - id: d
    text: At the GitRepository interval.
    explanation: Not correct. The interval does not affect it.
  correct_option: a
  explanation: Correct. The Flux controllers do not export this metric.
- id: ats099-020-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Read a histogram
  source_readings:
  - sections/section-020/module-01/course-03-metrics-and-flux-stats.md
  prompt: What kind of metric is gotk_reconcile_duration_seconds?
  options:
  - id: a
    text: A gauge that goes up and down.
    explanation: Not correct. It sorts measurements into buckets.
  - id: b
    text: A histogram, with the series _bucket, _count and _sum.
    explanation: Correct. It records how long reconciliations take per object.
  - id: c
    text: A counter with a single series.
    explanation: Not correct. It has three series.
  - id: d
    text: A log line per reconcile.
    explanation: Not correct. It is a metric, not a log.
  correct_option: b
  explanation: Correct. It records how long reconciliations take per object.
- id: ats099-020-q11
  type: single_choice
  difficulty: beginner
  learning_objective: Keep a provider address out of Git
  source_readings:
  - sections/section-020/module-01/course-04-provider-types-and-secrets.md
  prompt: Where should the webhook address of a Slack Provider be kept?
  options:
  - id: a
    text: In `spec.address` of the Provider in Git.
    explanation: Not correct. The address works like a password because anyone who
      holds it can post to the channel. A Secret in the Provider's namespace keeps
      it out of Git.
  - id: b
    text: In an annotation on the Alert.
    explanation: Not correct. The address works like a password because anyone who
      holds it can post to the channel. A Secret in the Provider's namespace keeps
      it out of Git.
  - id: c
    text: In a Secret with the key `address`, named by `spec.secretRef`.
    explanation: Correct. The address works like a password because anyone who holds
      it can post to the channel. A Secret in the Provider's namespace keeps it out
      of Git.
  - id: d
    text: In the `inclusionList` of the Alert.
    explanation: Not correct. The address works like a password because anyone who
      holds it can post to the channel. A Secret in the Provider's namespace keeps
      it out of Git.
  correct_option: c
  explanation: Correct. The address works like a password because anyone who holds
    it can post to the channel. A Secret in the Provider's namespace keeps it out
    of Git.
- id: ats099-020-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: Read what Ready on a Provider means
  source_readings:
  - sections/section-020/module-01/course-04-provider-types-and-secrets.md
  prompt: A Provider shows `Ready` `True`, but no messages arrive. What does `Ready`
    tell you?
  options:
  - id: a
    text: Messages were delivered at least once.
    explanation: Not correct. `Ready` checks the configuration, such as the Secret.
      The log of notification-controller shows the HTTP status of each delivery.
  - id: b
    text: The configuration was accepted. It does not say that delivery works.
    explanation: Correct. `Ready` checks the configuration, such as the Secret. The
      log of notification-controller shows the HTTP status of each delivery.
  - id: c
    text: The channel exists on the chat service.
    explanation: Not correct. `Ready` checks the configuration, such as the Secret.
      The log of notification-controller shows the HTTP status of each delivery.
  - id: d
    text: The Alert is connected to the Provider.
    explanation: Not correct. `Ready` checks the configuration, such as the Secret.
      The log of notification-controller shows the HTTP status of each delivery.
  correct_option: b
  explanation: Correct. `Ready` checks the configuration, such as the Secret. The
    log of notification-controller shows the HTTP status of each delivery.
- id: ats099-020-q13
  type: single_choice
  difficulty: beginner
  learning_objective: Choose the tool that lists events of one object
  source_readings:
  - sections/section-020/module-01/course-05-reading-events-and-logs.md
  prompt: Which command lists the events Flux recorded for the Kustomization `podinfo`?
  options:
  - id: a
    text: "`flux events --for Kustomization/podinfo -n flux-system`"
    explanation: Correct. `flux events` with `--for` limits the list to one object.
  - id: b
    text: "`flux logs --events podinfo`"
    explanation: Not correct. `flux events` with `--for` limits the list to one object.
  - id: c
    text: "`kubectl get alerts -n flux-system`"
    explanation: Not correct. `flux events` with `--for` limits the list to one object.
  - id: d
    text: "`flux trace kustomization podinfo`"
    explanation: Not correct. `flux events` with `--for` limits the list to one object.
  correct_option: a
  explanation: Correct. `flux events` with `--for` limits the list to one object.
- id: ats099-020-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: Say why events must be read soon
  source_readings:
  - sections/section-020/module-01/course-05-reading-events-and-logs.md
  prompt: Why should you read Kubernetes events soon after a failure?
  options:
  - id: a
    text: Flux deletes events when the object is Ready again.
    explanation: Not correct. Events expire. Forwarding them with an Alert keeps a
      copy.
  - id: b
    text: Events are cleared on every reconcile.
    explanation: Not correct. Events expire. Forwarding them with an Alert keeps a
      copy.
  - id: c
    text: Events are kept only for objects in `flux-system`.
    explanation: Not correct. Events expire. Forwarding them with an Alert keeps a
      copy.
  - id: d
    text: Kubernetes keeps events only for a short time, about an hour by default.
    explanation: Correct. Events expire. Forwarding them with an Alert keeps a copy.
  correct_option: d
  explanation: Correct. Events expire. Forwarding them with an Alert keeps a copy.
- id: ats099-020-q15
  type: single_choice
  difficulty: beginner
  learning_objective: Say what a Receiver does
  source_readings:
  - sections/section-020/module-02/course-01-what-a-receiver-is.md
  prompt: What does a Receiver do when a call arrives on its path?
  options:
  - id: a
    text: It applies the manifests from the request body.
    explanation: Not correct. The call only asks for a check. The source then fetches
      the latest revision of the branch it follows.
  - id: b
    text: It changes the revision of the GitRepository.
    explanation: Not correct. The call only asks for a check. The source then fetches
      the latest revision of the branch it follows.
  - id: c
    text: It asks the listed Flux objects to reconcile now.
    explanation: Correct. The call only asks for a check. The source then fetches
      the latest revision of the branch it follows.
  - id: d
    text: It restarts the Flux controllers.
    explanation: Not correct. The call only asks for a check. The source then fetches
      the latest revision of the branch it follows.
  correct_option: c
  explanation: Correct. The call only asks for a check. The source then fetches the
    latest revision of the branch it follows.
- id: ats099-020-q16
  type: single_choice
  difficulty: intermediate
  learning_objective: Keep the interval with a Receiver
  source_readings:
  - sections/section-020/module-02/course-01-what-a-receiver-is.md
  prompt: Why keep an `interval` on a source that has a Receiver?
  options:
  - id: a
    text: The Receiver cannot work without an interval.
    explanation: Not correct. A webhook is sent once. A long interval such as `1h`
      costs few requests and still catches a missed call.
  - id: b
    text: A webhook can be lost, and the interval is the fallback.
    explanation: Correct. A webhook is sent once. A long interval such as `1h` costs
      few requests and still catches a missed call.
  - id: c
    text: The interval sets how fast the Receiver responds.
    explanation: Not correct. A webhook is sent once. A long interval such as `1h`
      costs few requests and still catches a missed call.
  - id: d
    text: The interval signs the webhook.
    explanation: Not correct. A webhook is sent once. A long interval such as `1h`
      costs few requests and still catches a missed call.
  correct_option: b
  explanation: Correct. A webhook is sent once. A long interval such as `1h` costs
    few requests and still catches a missed call.
- id: ats099-020-q17
  type: single_choice
  difficulty: intermediate
  learning_objective: Find the annotation a Receiver sets
  source_readings:
  - sections/section-020/module-02/course-01-what-a-receiver-is.md
  prompt: Which annotation changes on a source after a Receiver asks it to reconcile?
  options:
  - id: a
    text: "`reconcile.fluxcd.io/requestedAt`"
    explanation: Correct. The Receiver sets the same annotation that `flux reconcile`
      sets, with the current time.
  - id: b
    text: "`kustomize.toolkit.fluxcd.io/reconcile`"
    explanation: Not correct. The Receiver sets the same annotation that `flux reconcile`
      sets, with the current time.
  - id: c
    text: "`notification.toolkit.fluxcd.io/trigger`"
    explanation: Not correct. The Receiver sets the same annotation that `flux reconcile`
      sets, with the current time.
  - id: d
    text: "`source.toolkit.fluxcd.io/fetch`"
    explanation: Not correct. The Receiver sets the same annotation that `flux reconcile`
      sets, with the current time.
  correct_option: a
  explanation: Correct. The Receiver sets the same annotation that `flux reconcile`
    sets, with the current time.
- id: ats099-020-q18
  type: single_choice
  difficulty: beginner
  learning_objective: Find the path of a Receiver
  source_readings:
  - sections/section-020/module-02/course-02-exposing-a-receiver-safely.md
  prompt: Where do you read the URL path to give to the sender?
  options:
  - id: a
    text: In `spec.webhookPath` of the Receiver.
    explanation: Not correct. The controller writes the path to the status once the
      Receiver is ready.
  - id: b
    text: In the label `path` on the Secret.
    explanation: Not correct. The controller writes the path to the status once the
      Receiver is ready.
  - id: c
    text: In the log of source-controller.
    explanation: Not correct. The controller writes the path to the status once the
      Receiver is ready.
  - id: d
    text: In `status.webhookPath` of the Receiver.
    explanation: Correct. The controller writes the path to the status once the Receiver
      is ready.
  correct_option: d
  explanation: Correct. The controller writes the path to the status once the Receiver
    is ready.
- id: ats099-020-q19
  type: single_choice
  difficulty: intermediate
  learning_objective: Say why the path contains a hash
  source_readings:
  - sections/section-020/module-02/course-02-exposing-a-receiver-safely.md
  prompt: What is the path of a Receiver computed from?
  options:
  - id: a
    text: The name of the Service only.
    explanation: Not correct. The hash makes the path impossible to guess without
      the token, and it changes when the token changes.
  - id: b
    text: A random value that never changes.
    explanation: Not correct. The hash makes the path impossible to guess without
      the token, and it changes when the token changes.
  - id: c
    text: A SHA-256 hash of the token, the name and the namespace of the Receiver.
    explanation: Correct. The hash makes the path impossible to guess without the
      token, and it changes when the token changes.
  - id: d
    text: The IP address of the sender.
    explanation: Not correct. The hash makes the path impossible to guess without
      the token, and it changes when the token changes.
  correct_option: c
  explanation: Correct. The hash makes the path impossible to guess without the token,
    and it changes when the token changes.
- id: ats099-020-q20
  type: single_choice
  difficulty: intermediate
  learning_objective: Name the Service that exposes receivers
  source_readings:
  - sections/section-020/module-02/course-02-exposing-a-receiver-safely.md
  prompt: Which Service receives the calls for Receivers?
  options:
  - id: a
    text: "`notification-controller` in `monitoring`"
    explanation: Not correct. Flux installs the Service `webhook-receiver` in `flux-system`.
      The receiver in `monitoring` in the lab only logs requests.
  - id: b
    text: "`webhook-receiver` in the namespace `flux-system`"
    explanation: Correct. Flux installs the Service `webhook-receiver` in `flux-system`.
      The receiver in `monitoring` in the lab only logs requests.
  - id: c
    text: "`source-controller` in `flux-system`"
    explanation: Not correct. Flux installs the Service `webhook-receiver` in `flux-system`.
      The receiver in `monitoring` in the lab only logs requests.
  - id: d
    text: "`webhook-receiver` in `monitoring`"
    explanation: Not correct. Flux installs the Service `webhook-receiver` in `flux-system`.
      The receiver in `monitoring` in the lab only logs requests.
  correct_option: b
  explanation: Correct. Flux installs the Service `webhook-receiver` in `flux-system`.
    The receiver in `monitoring` in the lab only logs requests.
- id: ats099-020-q21
  type: single_choice
  difficulty: intermediate
  learning_objective: Limit what an Ingress exposes
  source_readings:
  - sections/section-020/module-02/course-02-exposing-a-receiver-safely.md
  prompt: What should an Ingress for a Receiver route?
  options:
  - id: a
    text: Only the path prefix `/hook/` of the Service `webhook-receiver`.
    explanation: Correct. Routing only the hook path keeps other endpoints of the
      controller private.
  - id: b
    text: The whole Service on every path.
    explanation: Not correct. Routing only the hook path keeps other endpoints of
      the controller private.
  - id: c
    text: The metrics port `8080`.
    explanation: Not correct. Routing only the hook path keeps other endpoints of
      the controller private.
  - id: d
    text: The Gitea Service.
    explanation: Not correct. Routing only the hook path keeps other endpoints of
      the controller private.
  correct_option: a
  explanation: Correct. Routing only the hook path keeps other endpoints of the controller
    private.
- id: ats099-020-q22
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose a type that checks a signature
  source_readings:
  - sections/section-020/module-02/course-03-receivers-for-git-hosts-and-registries.md
  prompt: Which Receiver type verifies an HMAC signature computed over the request
    body?
  options:
  - id: a
    text: "`generic`"
    explanation: Not correct. `generic-hmac` checks the `X-Signature` header. `generic`
      relies on the secret path alone.
  - id: b
    text: "`github` with no events"
    explanation: Not correct. `generic-hmac` checks the `X-Signature` header. `generic`
      relies on the secret path alone.
  - id: c
    text: "`dockerhub`"
    explanation: Not correct. `generic-hmac` checks the `X-Signature` header. `generic`
      relies on the secret path alone.
  - id: d
    text: "`generic-hmac`"
    explanation: Correct. `generic-hmac` checks the `X-Signature` header. `generic`
      relies on the secret path alone.
  correct_option: d
  explanation: Correct. `generic-hmac` checks the `X-Signature` header. `generic`
    relies on the secret path alone.
- id: ats099-020-q23
  type: single_choice
  difficulty: intermediate
  learning_objective: Filter events of a Git host
  source_readings:
  - sections/section-020/module-02/course-03-receivers-for-git-hosts-and-registries.md
  prompt: What does `spec.events` do on a Receiver of type `github`?
  options:
  - id: a
