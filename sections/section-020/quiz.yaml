  - id: b
    text: It lists the namespaces to reconcile.
    explanation: Not correct. Without `events`, every event of the host triggers a
      reconcile, including events like issue comments.
  - id: c
    text: It lists the event names that trigger a reconcile, such as `ping` and `push`.
    explanation: Correct. Without `events`, every event of the host triggers a reconcile,
      including events like issue comments.
  - id: d
    text: It sets the severity of the notifications.
    explanation: Not correct. Without `events`, every event of the host triggers a
      reconcile, including events like issue comments.
  correct_option: c
  explanation: Correct. Without `events`, every event of the host triggers a reconcile,
    including events like issue comments.
- id: ats099-020-q24
  type: single_choice
  difficulty: beginner
  learning_objective: Say what the token must equal
  source_readings:
  - sections/section-020/module-02/course-03-receivers-for-git-hosts-and-registries.md
  prompt: For a Receiver of type `github`, what must the token in the Secret equal?
