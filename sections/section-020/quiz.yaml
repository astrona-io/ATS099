# Knowledge check for section 020. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats099-020
course_id: ATS099
exam_code: FLUX
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-020
  title: Alerting And Monitoring
placement:
  position: after
  reading: sections/section-020/capstone/labs/lab-01/question.md
questions:
- id: ats099-020-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Tell Provider from Alert
  source_readings:
  - sections/section-020/module-01/course-01-events-providers-and-alerts.md
  prompt: Which object says where Flux events are sent?
  options:
  - id: a
    text: An Alert.
    explanation: Not correct. An Alert says which events to send.
  - id: b
    text: A Provider.
    explanation: Correct. A Provider holds the type and the address.
  - id: c
    text: A GitRepository.
    explanation: Not correct. It fetches a repository.
  - id: d
    text: A Kustomization.
    explanation: Not correct. It applies files.
  correct_option: b
  explanation: Correct. A Provider holds the type and the address.
- id: ats099-020-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Store chat webhook addresses safely
  source_readings:
  - sections/section-020/module-01/course-01-events-providers-and-alerts.md
  prompt: Where do you keep the address of a Microsoft Teams webhook?
  options:
  - id: a
    text: In spec.address of the Provider in Git.
    explanation: Not correct. That puts the secret in Git.
  - id: b
    text: In the eventMetadata of the Alert.
    explanation: Not correct. eventMetadata is sent with every event.
  - id: c
    text: In a Secret with the key address, named in spec.secretRef.
    explanation: Correct. Whoever holds the address can post to the channel.
  - id: d
    text: In a ConfigMap in flux-system.
    explanation: Not correct. A ConfigMap is not a secret store.
  correct_option: c
  explanation: Correct. Whoever holds the address can post to the channel.
- id: ats099-020-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Describe a generic Provider
  source_readings:
  - sections/section-020/module-01/course-01-events-providers-and-alerts.md
  prompt: How does a generic Provider deliver an event?
  options:
  - id: a
    text: As an HTTP GET with the event in the query string.
    explanation: Not correct. The body is sent with POST.
  - id: b
    text: By writing a file on the node.
    explanation: Not correct. Nothing is written to the node.
  - id: c
    text: By creating a Secret in the receiver's namespace.
    explanation: Not correct. It sends a request.
  - id: d
    text: As an HTTP POST with a JSON body to the address.
    explanation: Correct. The receiver reads the JSON.
  correct_option: d
  explanation: Correct. The receiver reads the JSON.
- id: ats099-020-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Know the severity default
  source_readings:
  - sections/section-020/module-01/course-02-filtering-alerts.md
  prompt: An Alert has no eventSeverity. Which events does it forward?
  options:
  - id: a
    text: Events of every severity, because the default is info.
    explanation: Correct. Leaving it out forwards every success too.
  - id: b
    text: Only errors.
    explanation: 'Not correct. Errors only needs eventSeverity: error.'
  - id: c
    text: No events until a severity is set.
    explanation: Not correct. The default applies.
  - id: d
    text: Only events with reason ReconciliationFailed.
    explanation: Not correct. Reasons are not filtered by default.
  correct_option: a
  explanation: Correct. Leaving it out forwards every success too.
- id: ats099-020-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Know the filter precedence
  source_readings:
  - sections/section-020/module-01/course-02-filtering-alerts.md
  prompt: An event message matches a pattern in inclusionList and a pattern in exclusionList.
    What happens?
  options:
  - id: a
    text: The event is sent, because inclusionList wins.
    explanation: Not correct. The order is the other way round.
  - id: b
    text: The event is sent twice.
    explanation: Not correct. An Alert sends an event once.
  - id: c
    text: The event is dropped, because exclusionList wins.
    explanation: Correct. A match in exclusionList always drops the event.
  - id: d
    text: The Alert reports an error.
    explanation: Not correct. No error is raised.
  correct_option: c
  explanation: Correct. A match in exclusionList always drops the event.
- id: ats099-020-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Know the eventSources namespace default
  source_readings:
  - sections/section-020/module-01/course-02-filtering-alerts.md
  prompt: An eventSources entry has no namespace. Which namespace does it mean?
  options:
  - id: a
    text: flux-system, always.
    explanation: Not correct. It is the Alert's own namespace.
  - id: b
    text: Every namespace.
    explanation: Not correct. Use separate entries for other namespaces.
  - id: c
    text: The default namespace.
    explanation: Not correct. default has no special role here.
  - id: d
    text: The namespace of the Alert.
    explanation: Correct. Under the lockdown, other namespaces are refused anyway.
  correct_option: d
  explanation: Correct. Under the lockdown, other namespaces are refused anyway.
- id: ats099-020-q07
  type: single_choice
  difficulty: advanced
  learning_objective: Explain a recovery that sends nothing
  source_readings:
  - sections/section-020/module-01/course-02-filtering-alerts.md
  prompt: 'An Alert with eventSeverity: error is in place. podinfo is repaired and
    the receiver gets nothing new. Why?'
  options:
  - id: a
    text: The recovery produces info events, and the severity filter drops them.
    explanation: Correct. Only error events pass.
  - id: b
    text: The receiver ignores recoveries.
    explanation: Not correct. The receiver never saw them.
  - id: c
    text: The Alert suspends itself after the first message.
    explanation: Not correct. An Alert has no such behaviour.
  - id: d
    text: Flux sends recovery events only after 24 hours.
    explanation: Not correct. They are not delayed.
  correct_option: a
  explanation: Correct. Only error events pass.
- id: ats099-020-q08
  type: single_choice
  difficulty: beginner
  learning_objective: Find the metrics endpoint
  source_readings:
  - sections/section-020/module-01/course-03-metrics-and-flux-stats.md
  prompt: On which port and path do the Flux controllers serve Prometheus metrics?
  options:
  - id: a
    text: Port 9440, path /healthz.
    explanation: Not correct. That is a health endpoint, not metrics.
  - id: b
    text: Port 8080, path /metrics.
    explanation: Correct. The container port is named http-prom.
  - id: c
    text: Port 443, path /metrics.
    explanation: Not correct. The controllers serve metrics on 8080.
  - id: d
    text: Port 8080, path /events.
    explanation: Not correct. The path is /metrics.
  correct_option: b
  explanation: Correct. The container port is named http-prom.
- id: ats099-020-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Locate gotk_resource_info
  source_readings:
  - sections/section-020/module-01/course-03-metrics-and-flux-stats.md
  prompt: The metric gotk_resource_info is missing in Prometheus. Where do you look
    first?
  options:
  - id: a
    text: At kube-state-metrics and its custom resource state configuration.
    explanation: Correct. The Flux controllers do not export this metric.
  - id: b
    text: At the Flux controllers' metrics port.
    explanation: Not correct. They do not export it.
  - id: c
    text: At the notification-controller Alert.
    explanation: Not correct. Alerts do not create metrics.
  - id: d
    text: At the GitRepository interval.
    explanation: Not correct. The interval does not affect it.
  correct_option: a
  explanation: Correct. The Flux controllers do not export this metric.
- id: ats099-020-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Read a histogram
  source_readings:
  - sections/section-020/module-01/course-03-metrics-and-flux-stats.md
  prompt: What kind of metric is gotk_reconcile_duration_seconds?
  options:
  - id: a
    text: A gauge that goes up and down.
    explanation: Not correct. It sorts measurements into buckets.
  - id: b
    text: A histogram, with the series _bucket, _count and _sum.
    explanation: Correct. It records how long reconciliations take per object.
  - id: c
    text: A counter with a single series.
    explanation: Not correct. It has three series.
  - id: d
    text: A log line per reconcile.
    explanation: Not correct. It is a metric, not a log.
  correct_option: b
  explanation: Correct. It records how long reconciliations take per object.
