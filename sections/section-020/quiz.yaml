- id: ats099-020-q38
  type: single_choice
  difficulty: intermediate
  learning_objective: Say why a rule can fire when alerts cannot
  source_readings:
  - sections/section-020/module-03/course-03-monitoring-flux-with-prometheus.md
  prompt: Why does a Prometheus rule still work when notification-controller is down?
  options:
  - id: a
    text: Prometheus restarts notification-controller.
    explanation: Not correct. Metrics and notifications are independent paths, so
      use both.
  - id: b
    text: Alerts and rules use the same Provider.
    explanation: Not correct. Metrics and notifications are independent paths, so
      use both.
  - id: c
    text: Prometheus reads the events directly.
    explanation: Not correct. Metrics and notifications are independent paths, so
      use both.
  - id: d
    text: It uses metrics from the other controllers and does not depend on notification-controller.
    explanation: Correct. Metrics and notifications are independent paths, so use
      both.
  correct_option: d
  explanation: Correct. Metrics and notifications are independent paths, so use both.
