  - id: c
    text: The name of the Receiver.
    explanation: Not correct. GitHub signs each request with the webhook secret. The
      controller checks the signature with the token.
  - id: d
    text: The GitHub App ID.
    explanation: Not correct. GitHub signs each request with the webhook secret. The
      controller checks the signature with the token.
  correct_option: b
  explanation: Correct. GitHub signs each request with the webhook secret. The controller
    checks the signature with the token.
- id: ats099-020-q25
  type: single_choice
  difficulty: intermediate
  learning_objective: Pick the Provider type for a commit status
  source_readings:
  - sections/section-020/module-02/course-04-commit-status-from-flux.md
  prompt: Which kind of Provider sets a status on a commit?
  options:
  - id: a
    text: A Git host type such as `github`, `gitlab` or `gitea`.
    explanation: Correct. Git host types call the host's API to set the commit status
      instead of sending a chat message.
  - id: b
    text: "`generic`"
    explanation: Not correct. Git host types call the host's API to set the commit
      status instead of sending a chat message.
  - id: c
    text: "`slack`"
    explanation: Not correct. Git host types call the host's API to set the commit
      status instead of sending a chat message.
  - id: d
    text: "`alertmanager`"
    explanation: Not correct. Git host types call the host's API to set the commit
      status instead of sending a chat message.
  correct_option: a
  explanation: Correct. Git host types call the host's API to set the commit status
    instead of sending a chat message.
- id: ats099-020-q26
  type: single_choice
  difficulty: intermediate
  learning_objective: Set the address of a commit status Provider
  source_readings:
  - sections/section-020/module-02/course-04-commit-status-from-flux.md
  prompt: What goes in `spec.address` of a commit status Provider?
  options:
  - id: a
    text: The address of the Git host.
    explanation: Not correct. The Provider needs to know which repository holds the
      commit.
  - id: b
    text: The address of the webhook-receiver Service.
    explanation: Not correct. The Provider needs to know which repository holds the
      commit.
  - id: c
    text: The name of the branch.
    explanation: Not correct. The Provider needs to know which repository holds the
      commit.
  - id: d
    text: The address of the repository.
    explanation: Correct. The Provider needs to know which repository holds the commit.
  correct_option: d
  explanation: Correct. The Provider needs to know which repository holds the commit.
- id: ats099-020-q27
  type: single_choice
  difficulty: intermediate
  learning_objective: Keep info events for commit status
  source_readings:
  - sections/section-020/module-02/course-04-commit-status-from-flux.md
  prompt: Why must an Alert for a commit status keep the default `eventSeverity`?
  options:
  - id: a
    text: Info events are cheaper to send than errors.
    explanation: 'Not correct. With `eventSeverity: error`, only failures arrive and
      no commit gets a success status.'
  - id: b
    text: The host rejects error events.
    explanation: 'Not correct. With `eventSeverity: error`, only failures arrive and
      no commit gets a success status.'
  - id: c
    text: The commit turns green only when a success event reaches the host.
    explanation: 'Correct. With `eventSeverity: error`, only failures arrive and no
      commit gets a success status.'
  - id: d
    text: The default severity hides the revision.
    explanation: 'Not correct. With `eventSeverity: error`, only failures arrive and
      no commit gets a success status.'
  correct_option: c
  explanation: 'Correct. With `eventSeverity: error`, only failures arrive and no
    commit gets a success status.'
- id: ats099-020-q28
  type: single_choice
  difficulty: beginner
  learning_objective: Name the condition that means the last reconcile worked
  source_readings:
  - sections/section-020/module-03/course-01-reading-status-conditions.md
  prompt: Which condition type says the last reconcile of the current spec finished
    with success?
  options:
  - id: a
    text: "`Stalled`"
    explanation: Not correct. `Ready` `True` is the main success condition of a Flux
      object.
  - id: b
    text: "`Ready`"
    explanation: Correct. `Ready` `True` is the main success condition of a Flux object.
  - id: c
    text: "`Reconciling`"
    explanation: Not correct. `Ready` `True` is the main success condition of a Flux
      object.
  - id: d
    text: "`Fetched`"
    explanation: Not correct. `Ready` `True` is the main success condition of a Flux
      object.
  correct_option: b
  explanation: Correct. `Ready` `True` is the main success condition of a Flux object.
- id: ats099-020-q29
  type: single_choice
  difficulty: intermediate
  learning_objective: Read Stalled
  source_readings:
  - sections/section-020/module-03/course-01-reading-status-conditions.md
  prompt: What does `Stalled` `True` mean on a Flux object?
  options:
  - id: a
    text: The controller stopped retrying because retrying cannot help until the spec
      changes.
    explanation: Correct. A stalled object, such as one with an invalid spec, needs
      a change in Git.
  - id: b
    text: The object is suspended.
    explanation: Not correct. A stalled object, such as one with an invalid spec,
      needs a change in Git.
  - id: c
    text: The controller restarts.
    explanation: Not correct. A stalled object, such as one with an invalid spec,
      needs a change in Git.
  - id: d
    text: The object waits for the next interval.
    explanation: Not correct. A stalled object, such as one with an invalid spec,
      needs a change in Git.
  correct_option: a
  explanation: Correct. A stalled object, such as one with an invalid spec, needs
    a change in Git.
- id: ats099-020-q30
  type: single_choice
  difficulty: intermediate
  learning_objective: Find the revision that runs
  source_readings:
  - sections/section-020/module-03/course-01-reading-status-conditions.md
  prompt: A Kustomization is `Ready` `False`. How do you tell which revision still
    runs?
  options:
  - id: a
    text: Read `status.lastAttemptedRevision`.
    explanation: Not correct. `lastAppliedRevision` is the revision applied last with
      success. `lastAttemptedRevision` is the one tried last.
  - id: b
    text: Read `spec.sourceRef`.
    explanation: Not correct. `lastAppliedRevision` is the revision applied last with
      success. `lastAttemptedRevision` is the one tried last.
  - id: c
    text: Read the Alert.
    explanation: Not correct. `lastAppliedRevision` is the revision applied last with
      success. `lastAttemptedRevision` is the one tried last.
  - id: d
    text: Read `status.lastAppliedRevision`.
    explanation: Correct. `lastAppliedRevision` is the revision applied last with
      success. `lastAttemptedRevision` is the one tried last.
  correct_option: d
  explanation: Correct. `lastAppliedRevision` is the revision applied last with success.
    `lastAttemptedRevision` is the one tried last.
- id: ats099-020-q31
  type: single_choice
  difficulty: beginner
  learning_objective: List every object that is not ready
  source_readings:
  - sections/section-020/module-03/course-01-reading-status-conditions.md
  prompt: Which command lists the Flux objects that are not ready, in every namespace?
  options:
  - id: a
    text: "`flux stats`"
    explanation: Not correct. `--status-selector` filters by the state of a condition.
  - id: b
    text: "`flux check`"
    explanation: Not correct. `--status-selector` filters by the state of a condition.
  - id: c
    text: "`flux get all -A --status-selector ready=false`"
    explanation: Correct. `--status-selector` filters by the state of a condition.
  - id: d
    text: "`kubectl get events -A`"
    explanation: Not correct. `--status-selector` filters by the state of a condition.
  correct_option: c
  explanation: Correct. `--status-selector` filters by the state of a condition.
- id: ats099-020-q32
  type: single_choice
  difficulty: intermediate
  learning_objective: Know when healthChecks is ignored
  source_readings:
  - sections/section-020/module-03/course-02-health-checks-and-timeouts.md
  prompt: When is `spec.healthChecks` ignored?
  options:
  - id: a
    text: When `spec.timeout` is set.
    explanation: 'Not correct. `wait: true` already covers every applied object, so
      use `wait` or `healthChecks`, not both.'
  - id: b
    text: When `spec.wait` is `true`.
    explanation: 'Correct. `wait: true` already covers every applied object, so use
      `wait` or `healthChecks`, not both.'
  - id: c
    text: When `prune` is `false`.
    explanation: 'Not correct. `wait: true` already covers every applied object, so
      use `wait` or `healthChecks`, not both.'
  - id: d
    text: When `dependsOn` is set.
    explanation: 'Not correct. `wait: true` already covers every applied object, so
      use `wait` or `healthChecks`, not both.'
  correct_option: b
  explanation: 'Correct. `wait: true` already covers every applied object, so use
    `wait` or `healthChecks`, not both.'
- id: ats099-020-q33
  type: single_choice
  difficulty: intermediate
  learning_objective: Say what retryInterval does
  source_readings:
  - sections/section-020/module-03/course-02-health-checks-and-timeouts.md
  prompt: What does `spec.retryInterval` set on a Kustomization?
  options:
  - id: a
    text: How long Flux waits before it tries again after a failure.
    explanation: Correct. Without it, the retry waits for the full `interval`.
  - id: b
    text: How long Flux waits for the health checks.
    explanation: Not correct. Without it, the retry waits for the full `interval`.
  - id: c
    text: How often Flux fetches the source.
    explanation: Not correct. Without it, the retry waits for the full `interval`.
  - id: d
    text: How long a failed object stays suspended.
    explanation: Not correct. Without it, the retry waits for the full `interval`.
  correct_option: a
  explanation: Correct. Without it, the retry waits for the full `interval`.
- id: ats099-020-q34
  type: single_choice
  difficulty: intermediate
  learning_objective: Say what timeout does
  source_readings:
  - sections/section-020/module-03/course-02-health-checks-and-timeouts.md
  prompt: 'A rollout takes 4 minutes and the Kustomization has `timeout: 2m` with
    a health check. What happens?'
  options:
  - id: a
    text: Flux waits 4 minutes and succeeds.
    explanation: Not correct. After the timeout, an object that is not ready counts
      as a failure.
  - id: b
    text: Flux deletes the Deployment.
    explanation: Not correct. After the timeout, an object that is not ready counts
      as a failure.
  - id: c
    text: Flux ignores the health check.
    explanation: Not correct. After the timeout, an object that is not ready counts
      as a failure.
  - id: d
    text: The reconcile fails with `HealthCheckFailed`, although the application starts.
    explanation: Correct. After the timeout, an object that is not ready counts as
      a failure.
  correct_option: d
  explanation: Correct. After the timeout, an object that is not ready counts as a
    failure.
- id: ats099-020-q35
  type: single_choice
  difficulty: intermediate
  learning_objective: Say what the Healthy condition shows
  source_readings:
  - sections/section-020/module-03/course-02-health-checks-and-timeouts.md
  prompt: When does a Kustomization set the condition `Healthy`?
  options:
  - id: a
    text: Always, on every Kustomization.
    explanation: Not correct. Without health checks, there is nothing to report, and
      `Healthy` is not set.
  - id: b
    text: Only when it has `dependsOn`.
    explanation: Not correct. Without health checks, there is nothing to report, and
      `Healthy` is not set.
  - id: c
    text: 'When it has health checks, through `wait: true` or `healthChecks`.'
    explanation: Correct. Without health checks, there is nothing to report, and `Healthy`
      is not set.
  - id: d
    text: Only when `prune` is true.
    explanation: Not correct. Without health checks, there is nothing to report, and
      `Healthy` is not set.
  correct_option: c
  explanation: Correct. Without health checks, there is nothing to report, and `Healthy`
    is not set.
