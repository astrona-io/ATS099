# Check The Health Of One Deployment
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-099-lab-020-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, starts Gitea, seeds the repositories and bootstraps Flux from gitops/fleet"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-099-lab-020-03-setup"
      description: "Checks the starting state: the Kustomization podinfo uses wait: true"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Gitea, the tester pod and the webhook receiver"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits for Gitea and the Flux controllers that exist"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-health-spec"
      description: "Passes when Kustomization podinfo checks Deployment podinfo, times out after 2m, retries every 1m and does not use wait"
      type: "file"
      source: "validation/validate-health-spec.sh"
    - name: "validate-healthy-and-ready"
      description: "Passes when the Kustomization podinfo has the conditions Ready and Healthy set to True"
      type: "file"
      source: "validation/validate-healthy-and-ready.sh"
    - name: "validate-health-in-git"
      description: "Passes when clusters/kind/podinfo.yaml in gitops/fleet holds the health check, the timeout and the retry interval"
      type: "file"
      source: "validation/validate-health-in-git.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - mendhak/http-https-echo:42
      - nicolaka/netshoot:v0.13
